<!doctype html><html lang="de"><head><meta charset="utf-8"><title>AGATE Files 02</title><link rel="stylesheet" href="/style.css"></head><body id="page-L11"><main><h1>Dateien im Browser</h1><label for="L11-upload">Einzeldatei</label><input id="L11-upload" type="file"><output id="L11-result"><span id="L11-upload-result">Keine Datei</span></output><label for="L11-multi">Mehrere Dateien</label><input id="L11-multi" type="file" multiple><output id="L11-multi-result">Keine Datei</output><a id="L11-download" href="/download.txt" download="learning-download.txt">Textdatei herunterladen</a><form method="post" action="/demo-report.pdf" target="_blank"><input type="hidden" name="fixture" value="local"><button id="L11-pdf">Original-PDF</button></form></main><script>document.getElementById('L11-upload').addEventListener('change',e=>document.getElementById('L11-upload-result').textContent=e.target.files[0]?.name||'Keine Datei');for(const [input,out] of [['L11-upload','L11-result'],['L11-multi','L11-multi-result']])document.getElementById(input).addEventListener('change',e=>document.getElementById(out==='L11-result'?'L11-upload-result':out).textContent=Array.from(e.target.files).map(f=>f.name).join(', ')||'Keine Datei');</script></body></html>
