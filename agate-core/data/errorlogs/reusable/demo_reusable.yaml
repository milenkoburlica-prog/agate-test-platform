# ============================================================================
# Reusable demo module
#
# B[...] = variables from the calling TestCase
# R[...] = parameters passed through CALL
# ============================================================================

steps:

  # --------------------------------------------------------------------------
  # 1. Execute command from TestCase B-variable
  # --------------------------------------------------------------------------
  - type: CMD
    op: EXEC
    command: "{B[command]}"
    response: resp1


  # --------------------------------------------------------------------------
  # 2. Assert exit code
  # --------------------------------------------------------------------------
  - type: CMD
    op: ASSERT
    response: resp1
    action: EXITCODE
    expected: 0


  # --------------------------------------------------------------------------
  # 3. Execute command received as reusable R-parameter
  # --------------------------------------------------------------------------
  - type: CMD
    op: EXEC
    command: "{R[command]}"
    response: resp1


  # --------------------------------------------------------------------------
  # 4. Assert exit code
  # --------------------------------------------------------------------------
  - type: CMD
    op: ASSERT
    response: resp1
    action: EXITCODE
    expected: 0


  # --------------------------------------------------------------------------
  # 5. Execute B-variable again
  # --------------------------------------------------------------------------
  - type: CMD
    op: EXEC
    command: "{B[command]}"
    response: resp1


  # --------------------------------------------------------------------------
  # 6. Assert exit code
  # --------------------------------------------------------------------------
  - type: CMD
    op: ASSERT
    response: resp1
    action: EXITCODE
    expected: 0


  # --------------------------------------------------------------------------
  # 7. Execute second B-variable
  # --------------------------------------------------------------------------
  - type: CMD
    op: EXEC
    command: "{B[command2]}"
    response: resp2


  # --------------------------------------------------------------------------
  # 8. Assert exit code
  # --------------------------------------------------------------------------
  - type: CMD
    op: ASSERT
    response: resp2
    action: EXITCODE
    expected: 0