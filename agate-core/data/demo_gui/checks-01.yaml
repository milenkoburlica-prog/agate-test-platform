    priority: HIGH
    variables: 
      name: AGATE learning L05

    timeout: 10000 
    steps:
    
      - section: Checkboxen und Radiobuttons — Lernseite öffnen
        description: 'Seite: http://127.0.0.1:8767/05-checks.html'
      
      - type: GUI
        op: EXEC
        action: OPEN
        url: http://127.0.0.1:8767/05-checks.html
