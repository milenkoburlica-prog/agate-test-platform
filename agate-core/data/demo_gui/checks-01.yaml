      - type: WAIT
        value: '5000'
      
      - section: Checkboxen und Radiobuttons
        description: Die zugehörige Reusable-Lektion ausführen. Abschnittstitel bleiben
          auch bei verbose=false sichtbar.
        
      - type: CALL
        command: reusable.checks.checks-01
        parameters:
          verbose: 'true'
