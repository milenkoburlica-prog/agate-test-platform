
  - id: "individuellesBeschaeftigungsverbotEinmelden"
    description: "individuellesBeschaeftigungsverbotEinmelden"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ''
        value: "{XL[Vertragspartner.VPNR]}"
 
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ''
        value: "{XL[Vertragspartner.Ord_id]}"

      - type: CALL
        command: 'reusable.ru_dialog_aufbau_mit_ordid'
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: 'baseContact'

      - type: CALL
        command: 'reusable.create_cardtoken_svsig_e_card'
        condition: 'CardToken.SVNRKarte != NULL'
        parameters: 
          SvNummer: '{XL[CardToken.SVNRKarte]}'
          VpNummer: '{XL[CardToken.VPNR]}'
          cardSlot: 'baseContact'

      - type: CALL
        command: 'reusable.create_cardtoken_vpsig_o_card'
        condition: 'CardToken.Tokentyp == VPVP'
        parameters: 
          VpNummer: '{XL[CardToken.VPNRKarte]}'
          cardSlot: 'baseContact'

      - type: CALL
        command: 'reusable.create_cardtoken_svsig_o_card'
        condition: 'CardToken.Tokentyp == VPSV'
        parameters: 
          VpNummer: '{XL[CardToken.VPNRKarte]}'
          SvNummer: '{XL[CardToken.SVNR]}'
          cardSlot: 'baseContact'
 
      - type: BUFFER
        op: EXEC
        name: "B_FileName"
        condition: 'DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL'
        value: "MUHI_{DATE}_{RND[5]}.pdf"

      # individuellesBeschaeftigungsverbotEinmelden Request Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.individuellesbeschaeftigungsverboteinmelden_request
        response: individuellesbeschaeftigungsverboteinmelden_request_response
        download: 
          - method: MTOM
            targetPath: "..\\Tosca\\Daten\\Files\\MUHI\\{B[B_FileName]}"
        parameters: 
          dialogId: "{XL[DialogID]}"
          beginnIndividuellesBeschaeftigungsverbot: "{XL[BeginnIndividuellesBeschaeftigungsverbot]}"
          begruendung: "{XL[Begruendung.Begruendung_kurz]}"
          begruendungVordatierung: "{XL[BegruendungVordatierung]}"
          ort: "{XL[Adresse_Patientin.Ort]}"
          postleitzahl: "{XL[Adresse_Patientin.Postleitzahl]}"
          staatencode: "{XL[Adresse_Patientin.Staatencode]}"
          strasse: "{XL[Adresse_Patientin.Strasse]}"
          cardToken: 
            - condition: 'CardToken.SVNRKarte == NULL AND CardToken.VPNRKarte == NULL AND CardToken.TokenWert == NULL  AND CardToken.TokenWert == NULL'
              value: ""
            - condition: 'CardToken.SVNRKarte != NULL OR CardToken.VPNRKarte != NULL AND CardToken.TokenWert == NULL'
              value: "{B[token]}"
            - condition: 'CardToken.TokenWert != NULL'
              value: "{XL[CardToken.TokenWert]}"
          voraussichtlicherGeburtstermin: "{XL[Vorraussichtlicher_Geburtstermin.Datum]}"
          vsnr: "{XL[SVPerson.SVNR]}"
          dauer: "{XL[Dauer]}"
          kzDauerBisAbsolut: "{XL[KzDauerBisAbsolut]}"
          zusatzbegruendung: "{XL[Zusatzbegruendung]}"

      # individuellesBeschaeftigungsverbotEinmelden Response - beginnIndividuellesBeschaeftigungsverbot (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL) AND ((BeginnIndividuellesBeschaeftigungsverbot==NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='individuellesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='beginnIndividuellesBeschaeftigungsverbot']"
        action: "EQUALS"
        expected: "{DATE}"
        response: individuellesbeschaeftigungsverboteinmelden_request_response

      # individuellesBeschaeftigungsverbotEinmelden Response - begruendung (Verify)
      - type: SOAP
        op: ASSERT
        condition: 'DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='individuellesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='begruendung']"
        action: "EQUALS"
        expected: "{XL[Begruendung.Begruendung_kurz]}"
        response: individuellesbeschaeftigungsverboteinmelden_request_response

