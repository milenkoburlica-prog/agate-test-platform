testCases: 

  - id: "GF_meldungAnlegen_WithConstraint"
    description: "GF_meldungAnlegen_WithConstraint"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 

      # meldungAnlegen_direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.aum.8.meldunganlegen
        response: meldunganlegen_response
        parameters: 
          dialogId: "{B[dialogId]}"
          cardToken: "{B[token]}"
          abweichendeAusgehzeitBis1: ""
          abweichendeAusgehzeitBis2: ""
          abweichendeAusgehzeitVon1: ""
          abweichendeAusgehzeitVon2: ""
          arbeitsunfaehigBis: ""
          arbeitsunfaehigVon: "{DATE[][][]}"
          behandlungsDatum: "{DATE[][][]}"
          berufskrankheit: "0"
          besondereArbeitsunfaehigkeitsursacheCode: ""
          besondereMitteilungAnSVT: ""
          bettruhe: "false"
          diagnose: "DiagnoseText"
          diagnoseCode: ""
          diagnoseCodeTyp: ""
          gehunfaehigBis: ""
          gipsBis: ""
          krankenhausaufenthaltBis: ""
          krankenhausaufenthaltVon: ""
          ort: "Testort"
          plz: "TestPLZ"
          rueckdatierungsgrundCode: ""
          staatencode: "AUT"
          strasse: "Teststraße"
          stromunfall: "false"
          svtCode: "AL"
          voraussichtlichArbeitsunfaehigBis: ""
          wiederbestellung: ""
          zusatzdiagnoseCode: ""
          meldungsArt: "AU"
          ekvkNummer: ""
          ekvkTraeger: ""
          geburtsdatum: ""
          geschlecht: ""
          svNummer: "2930049109"
          vorname: ""
          zuname: ""
          forceExecution: "false"
          ungeprueft: "false"
          offeneMeldungenSuchen: "false"

      # meldungAnlegen Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        source: STATUS
        action: EQUALS
        expected: "200"
        response: meldunganlegen_response

      # meldungAnlegen Response - id (Buffer)
      - type: SOAP
        op: BUFFER
        name: MeldungsID
        source: BODY
        selector: XML_PATH
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='id']"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 05

      # meldungAnlegen Response - meldungsart (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsart']"
        action: "EQUALS"
        expected: "AU"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 05

      # meldungAnlegen Response - ungeprueft (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='ungeprueft']"
        action: "EQUALS"
        expected: "false"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 05

      # meldungAnlegen Response - meldungsart (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsart']"
        action: "EQUALS"
        expected: "AU"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 12

      # meldungAnlegen Response - strasse (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='strasse']"
        action: "EQUALS"
        expected: "uliza sezama"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 12

      # meldungAnlegen Response - ungeprueft (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='ungeprueft']"
        action: "EQUALS"
        expected: "false"
        response: meldunganlegen_response
        constrains: 
          - path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='meldungAnlegenResponse']/*[local-name()='return']/*[local-name()='quittung']/*[local-name()='meldungsdaten']/*[local-name()='svtCode']
            action: EQUALS
            expected: 12
