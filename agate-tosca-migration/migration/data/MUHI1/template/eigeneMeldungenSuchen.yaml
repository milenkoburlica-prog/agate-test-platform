            expected: "{B[B_meldungsId]}"

      # eigeneMeldungenSuchen Response - zuname (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL) AND ((Meldungsuebersicht.SVPerson.Druckname.Nachname == NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='zuname']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.Name.Nachname]}"
        response: eigenemeldungensuchen_request_response
        constraints: 
          - path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='meldungsId']"
            action: "EQUALS"
            expected: "{B[B_meldungsId]}"

      # eigeneMeldungenSuchen Response - vorname (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL) AND ((Meldungsuebersicht.SVPerson.Name.Vorname != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='vorname']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.Druckname.Vorname]}"
        response: eigenemeldungensuchen_request_response
        constraints: 
          - path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='meldungsId']"
            action: "EQUALS"
            expected: "{B[B_meldungsId]}"

      # eigeneMeldungenSuchen Response - zuname (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL) AND ((Meldungsuebersicht.SVPerson.Druckname.Nachname != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='zuname']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.Druckname.Nachname]}"
        response: eigenemeldungensuchen_request_response
        constraints: 
          - path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='meldungsId']"
            action: "EQUALS"
            expected: "{B[B_meldungsId]}"

      # eigeneMeldungenSuchen Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: 'DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL'
        source: STATUS
        action: EQUALS
        expected: "200"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: 'DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL'
        source: STATUS
        action: EQUALS
        expected: "500"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - DialogException (Unknown_Insert)
      # [Warning] Skipped DialogException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((DialogException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[DialogException.InfoCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((DialogException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[DialogException.ExceptionCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((DialogException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[DialogException.InfoText]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - CardException (Unknown_Insert)
      # [Warning] Skipped CardException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((CardException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='CardException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[CardException.InfoCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((CardException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='CardException']/*[local-name()='errorCode']"
        action: "EQUALS"
