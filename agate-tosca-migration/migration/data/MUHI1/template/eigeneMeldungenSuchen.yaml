        action: "EQUALS"
        expected: "{XL[MuhiException.InfoCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: '((DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL) AND ((MuhiException != NULL)))'
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='MuhiException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[MuhiException.ExceptionCode]}"
        response: eigenemeldungensuchen_request_response

