steps:

      - type: BUFFER
        op: EXEC
        name: B_FileName
        value: "MUHI_{DATE}_{RND[5]}.pdf"

      # absolutesBeschaeftigungsverbotEinmelden Request Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.absolutesbeschaeftigungsverboteinmelden
        response: soap.muhi.1.absolutesbeschaeftigungsverboteinmelden_response
        parameters:
          ort: "Wien"
          postleitzahl: "1010"
          staatencode: "AUT"
          strasse: "Stephansplatz 1"

      # [Merged] absolutesBeschaeftigungsverbotEinmelden Response is handled by the Request step
