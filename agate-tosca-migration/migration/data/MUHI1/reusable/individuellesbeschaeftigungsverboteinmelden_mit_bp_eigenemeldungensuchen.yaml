steps:

      - type: BUFFER
        op: EXEC
        name: B_FileName
        value: "MUHI_{DATE}_{RND[5]}.pdf"

      # individuellesBeschaeftigungsverbotEinmelden Request  Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.individuellesbeschaeftigungsverboteinmelden_request
        response: soap.muhi.1.individuellesbeschaeftigungsverboteinmelden_request_response
        parameters:
          begruendung: "IG_01"
          ort: "Wien"
          postleitzahl: "1010"
          staatencode: "AUT"
          strasse: "Stephansplatz 1"
          dauer: "1"
          kzDauerBisAbsolut: "false"

      # [Merged] individuellesBeschaeftigungsverbotEinmelden Response is handled by the Request step
