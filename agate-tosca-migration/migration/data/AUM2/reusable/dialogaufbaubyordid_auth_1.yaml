steps:

      - type: BUFFER
        op: EXEC
        name: URL_HIGH
        value: "{E[env.ecard.service]}"


      - type: BUFFER
        op: EXEC
        name: VpNummer
        value: "{R[VpNummer]}"


      - type: BUFFER
        op: EXEC
        name: URL_HIGH
        value: "{E[env.ecard.service]}"

      - type: CALL
        command: "reusable.create_cardtoken_vpsig_o_card"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: 'baseContact'

      # authenticateDialog Request
      - type: SOAP
        op: EXEC
        endpoint: "https://{B[URL_HIGH]}"
        command: soap.auth.1.authenticatedialog_request
        response: soap.auth.1.authenticatedialog_request_response

      # [Merged] authenticateDialog Response is handled by the Request step

      # setDialogAddress Request
      - type: SOAP
        op: EXEC
        endpoint: "https://{B[URL_HIGH]}"
        command: soap.auth.1.setdialogaddress_request
        response: soap.auth.1.setdialogaddress_request_response

      # [Merged] setDialogAddress Response is handled by the Request step
