steps:

      - type: BUFFER
        op: EXEC
        condition: "('{B[dialogId_{R[VpNummer]}_{R[ORD_ID]}]}'=='{REGEX['[A-Za-z0-9]{32}']}')"
        name: dialogId
        value: "{B[dialogId_{R[VpNummer]}_{R[ORD_ID]}]}"

      - type: CALL
        command: "reusable.dialogaufbaubyordid_auth_1"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: 'baseContact'


      - type: BUFFER
        op: EXEC
        condition: "(NOT (('{B[dialogId_{R[VpNummer]}_{R[ORD_ID]}]}'=='{REGEX['[A-Za-z0-9]{32}']}')))"
        name: dialogId_{PL[VpNummer]}_{PL[ORD_ID]}
        value: "{B[dialogId]}"
