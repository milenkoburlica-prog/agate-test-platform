steps:
      - type: CALL
        command: "reusable.wks_db_kontakt_erstellen"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'

      - type: CALL
        command: "reusable.wks_db_setze_wks_kontakt_als_abgelaufen_vorvorletztes_quartal_für_svnr"
        condition: "WKS_Kontakt.Ablauf != NULL"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'

      - type: CALL
        command: "reusable.wks_db_storniere_wks_kontakt_für_svnr"
        condition: "WKS_Kontakt.Stornierung != NULL"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
