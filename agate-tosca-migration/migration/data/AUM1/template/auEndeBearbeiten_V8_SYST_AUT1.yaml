
  - id: "auEndeBearbeiten_V8_SYST_AUT1"
    description: "auEndeBearbeiten_V8_SYST_AUT1"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 

      - type: CALL
        command: 'reusable.erzeuge_fremdmeldung'
        condition: 'Vertragspartner.VPNR_Fremdmeldung != NULL'
 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "{XL[Vertragspartner.VPNR]}"
 
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "{XL[Vertragspartner.Ord_id]}"

      - type: CALL
        command: 'reusable.ru_dialog_aufbau_mit_ordid'
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: 'baseContact'

      - type: CALL
        command: 'reusable.wks_erzeuge_wks_kontakt'
        condition: 'WKS_Kontakt.Herkunft != NULL'

      - type: CALL
        command: 'reusable.erzeuge_basisdaten_ohne_create_close_dialog_aum8_auth1_bp'
        condition: 'Vertragspartner.VPNR_Fremdmeldung == NULL'
        parameters: 
          Meldungsnummer: '{XL[Vorbereitete Meldung anlegen]}'

      - type: CALL
        command: 'reusable.create_cardtoken_svsig_e_card'
        condition: ''CardToken.SVNR-Karte' != NULL'
        parameters: 
          SvNummer: '{XL[CardToken.SVNR-Karte]}'
          VpNummer: '{XL[CardToken.VPNR]}'
          cardSlot: 'baseContact'

      # auEndeBearbeiten Request_Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.aum.8.auendebearbeiten_request
        response: auendebearbeiten_request_response
        parameters: 
          dialogId: "{XL[DialogID]}"
          cardToken: "{B[token]}"
          aufId: "{XL[uniqeId]}"
          aufIdVersion: "{XL[aufIdVersion]}"
          arbeitsunfaehigBis: "{XL[ArbeitsunfaehigBis]}"
          forceExecution: "{XL[forceExecution]}"

      # auEndeBearbeiten Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND AumInvalidParameterException == NULL AND CardException == NULL AND AumException == NULL AND AccessException == NULL"
        source: STATUS
        action: EQUALS
        expected: "200"
        response: auendebearbeiten_request_response

      # auEndeBearbeiten Response - svtCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND AumInvalidParameterException == NULL AND CardException == NULL AND AumException == NULL AND AccessException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='auEndeBearbeitenResponse']/*[local-name()='return']/*[local-name()='svtCode']"
        action: "EQUALS"
        expected: "{XL[Rückgabe SVT 1]}"
        response: auendebearbeiten_request_response

      # auEndeBearbeiten Response - arbeitsunfaehigBis (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND AumInvalidParameterException == NULL AND CardException == NULL AND AumException == NULL AND AccessException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='auEndeBearbeitenResponse']/*[local-name()='return']/*[local-name()='arbeitsunfaehigBis']"
        action: "EQUALS"
        expected: "{XL[ArbeitsunfaehigBis]}"
        response: auendebearbeiten_request_response

      # auEndeBearbeiten Response - svNummer (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException == NULL AND AumInvalidParameterException == NULL AND CardException == NULL AND AumException == NULL AND AccessException == NULL) AND (('Rückgabe SVNR' != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='auEndeBearbeitenResponse']/*[local-name()='return']/*[local-name()='svNummer']"
        action: "EQUALS"
        expected: "{XL[Rückgabe SVNR.SVNR]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL"
        source: STATUS
        action: EQUALS
        expected: "500"
        response: auendebearbeiten_request_response

      # AUM Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((DialogException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[DialogException.InfoCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((DialogException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[DialogException.ExceptionCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((DialogException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[DialogException.InfoText]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumInvalidParameterException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumInvalidParameterException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[AumInvalidParameterException.InfoCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumInvalidParameterException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumInvalidParameterException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[AumInvalidParameterException.ExceptionCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumInvalidParameterException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumInvalidParameterException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[AumInvalidParameterException.InfoText]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((CardException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='CardException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[CardException.InfoCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((CardException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='CardException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[CardException.ExceptionCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((CardException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='CardException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[CardException.InfoText]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[AumException.InfoCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[AumException.ExceptionCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AumException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AumException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[AumException.InfoText]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AccessException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[AccessException.InfoCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AccessException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[AccessException.ExceptionCode]}"
        response: auendebearbeiten_request_response

      # AUM Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR AumInvalidParameterException != NULL OR CardException != NULL OR AumException != NULL OR AccessException != NULL) AND ((AccessException != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[AccessException.InfoText]}"
        response: auendebearbeiten_request_response

      - type: CALL
        command: 'reusable.dialogclose_auth1'
        parameters:
          dialogId: '{B[dialogId]}'

      - type: CALL
        command: 'reusable.db_lösche_alle_meldungen_von_heute_de'

      - type: CALL
        command: 'reusable.wks_db_lösche_alte_wks_kontakte_für_svnr'
        condition: 'WKS_Kontakt.Herkunft != NULL'
        parameters: 
          SVNR: '{XL[SVNUMMER.SVNR]}'
