
  - id: "detaildatenAbfragen"
    description: "detaildatenAbfragen"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        value: "{XL[Vertragspartner.VPNR]}"
 
      - type: BUFFER
