name: create_cardtoken_svsig_e_card
steps:

      - type: BUFFER
        op: EXEC
        name: GinoCardSlot
        value: "{R[cardSlot]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesername
        value: "{E[users.seriennummer]}"


      - type: BUFFER
        op: EXEC
        name: KartenleserIP
        value: "{E[users.ginoip]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesersimulator
        value: "{E[users.serverip]}"


      - type: BUFFER
        op: EXEC
        name: VpNummer
        value: "{R[VpNummer]}"


      - type: BUFFER
        op: EXEC
        name: SvNummer
        value: "{R[SvNummer]}"

      # A
      - type: CALL
        command: "reusable.o_e_card_stecken"
        parameters:
          cdfName: "{R[SvNummer]}"
          cardSlot: "baseContact"



      # A1. cardToken_svSig_e_card_baseContact Request
      - type: REST
        op: EXEC
        condition: "('{B[GinoCardSlot]}'=='baseContact')"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_e_card_basecontact_request
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basecontact_request_response
        paramter:
          VpNummer: "{B[VpNummer]}"

      # A2.  
      - type: REST
        op: ASSERT
        condition: "('{B[GinoCardSlot]}'=='baseContact')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basecontact_request_response
        source: STATUS
        action: EQUALS
        expected: 200

      # A3. 
      - type: REST
        op: BUFFER
        name: token
        source: BODY
        selector: JSON_PATH
        path: status.baseContact.token.value
        condition: "('{B[GinoCardSlot]}'=='baseContact')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basecontact_request_response



      # B1 cardToken_svSig_e_card_baseNfc Request
      - type: REST
        op: EXEC
        condition: "('{B[GinoCardSlot]}'=='baseNfc')"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_e_card_basenfc_request
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basenfc_request_response
        paramter:
          VpNummer: "{B[VpNummer]}"

      # B2 
      - type: REST
        op: ASSERT
        condition: "('{B[GinoCardSlot]}'=='baseNfc')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basenfc_request_response
        source: STATUS
        action: EQUALS
        expected: 200

      # B3
      - type: REST
        op: BUFFER
        name: token
        source: BODY
        selector: JSON_PATH
        path: status.baseNfc.token.value
        condition: "('{B[GinoCardSlot]}'=='baseNfc')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_basenfc_request_response



      # C1 cardToken_svSig_e_card_satelliteNfc Request
      - type: REST
        op: EXEC
        condition: "('{B[GinoCardSlot]}'=='satelliteNfc')"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_e_card_satellitenfc_request
        response: rest.gino.v2.status.cardtoken_svsig_e_card_satellitenfc_request_response
        paramter:
          VpNummer: "{B[VpNummer]}"


      # C2
      - type: REST
        op: ASSERT
        condition: "('{B[GinoCardSlot]}'=='satelliteNfc')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_satellitenfc_request_response
        source: STATUS
        action: EQUALS
        expected: 200

      # C3
      - type: REST
        op: BUFFER
        name: token
        source: BODY
        selector: JSON_PATH
        path: status.satelliteNfc.token.value
        condition: "('{B[GinoCardSlot]}'=='satelliteNfc')"
        response: rest.gino.v2.status.cardtoken_svsig_e_card_satellitenfc_request_response
