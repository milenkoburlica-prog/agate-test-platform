
- id: "eigeneMeldungenSuchen"
    description: "eigeneMeldungenSuchen"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 

      - type: CALL
        command: "reusable.deletemeldungenfromvpnr_bp"
        condition: "Vertragspartner.VPNR == "336010""
        parameters: 
          VPNR: "{XL[Vertragspartner.VPNR]}"
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "{XL[Vertragspartner.VPNR]}"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "{XL[Vertragspartner.Ord_id]}"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: "{B[B_OrdinationsId]}"
          vpNummer: "{B[B_Karte]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.absolutesbeschaeftigungsverboteinmelden_mit_bp_(eigenemeldungensuchen)"
        condition: "Meldungsuebersicht.Typ =="A""
        parameters: 
          vsnr: "{XL[Meldungsuebersicht.SVPerson.SVNR]}"
          voraussichtlicherGeburtstermin: "{XL[Meldungsuebersicht.Vorraussichtlicher_Geburtstermin.Datum]}"

      - type: CALL
        command: "reusable.individuellesbeschaeftigungsverboteinmelden_mit_bp_(eigenemeldungensuchen)"
        condition: "Meldungsuebersicht.Typ =="I""
        parameters: 
          vsnr: "{XL[Meldungsuebersicht.SVPerson.SVNR]}"
          voraussichtlicherGeburtstermin: "{XL[Meldungsuebersicht.Vorraussichtlicher_Geburtstermin.Datum]}"

      # Execute SQL Query
      - type: SQL
        op: EXEC
        condition: "Meldungsuebersicht.Erstellungszeitpunkt != NULL"
        command: "UPDATE MH_MELDUNG SET ERSTELLUNGS_ZEITPUNKT=to_date('{XL[Meldungsuebersicht.Erstellungszeitpunkt]}', 'DD-MM-YYYY hh24:mi:ss') where ID='{B[B_meldungsId]}'"
        response: setze_erstellungsdatum_in_db_res


      # Execute SQL Query
      - type: SQL
        op: EXEC
        condition: "Meldungsuebersicht.isStorniert == "true""
        command: "UPDATE MH_MELDUNG SET STORNIERT_AM=to_date('{DATETIME[][][dd-MM-yyyy hh:mm:ss]}', 'DD-MM-YYYY hh24:mi:ss') where ID='{B[B_meldungsId]}'"
        response: storniere_meldung_in_db_res


      # eigeneMeldungenSuchen Request Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.eigenemeldungensuchen_request
        response: eigenemeldungensuchen_request_response
        parameters: 
          dialogId: "{XL[DialogID]}"
          suchparameter: "{NULL}"
          art: "{XL[Suchparameter.Art]}"
          erstelltAb: "{XL[Suchparameter.ErstelltAb]}"
          erstelltBis: "{XL[Suchparameter.ErstelltBis]}"
          typ: "{XL[Suchparameter.Typ]}"
          voraussichtlicherGeburtsterminAb: "{XL[Suchparameter.voraussichtlicherGeburtsterminAb.Datum]}"
          voraussichtlicherGeburtsterminBis: "{XL[Suchparameter.voraussichtlicherGeburtsterminBis.Datum]}"
          vsnr: "{XL[Suchparameter.SVNR]}"

      # eigeneMeldungenSuchen Response - erstellungszeitpunkt (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='erstellungszeitpunkt']"
        action: "EXISTS"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - meldungsId (Unknown_519)
      # [Warning] Skipped meldungsId. Unsupported ActionMode: Unknown_519

      # eigeneMeldungenSuchen Response - storniert (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='storniert']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.isStorniert]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - typ (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='typ']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.Typ]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - voraussichtlicherGeburtstermin (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='voraussichtlicherGeburtstermin']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.Vorraussichtlicher_Geburtstermin.Datum]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - vorname (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='vorname']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.Druckname.Vorname]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - vsnr (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='vsnr']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.SVNR]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - zuname (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='eigeneMeldungenSuchenResponse']/*[local-name()='return']/*[local-name()='zuname']"
        action: "EQUALS"
        expected: "{XL[Meldungsuebersicht.SVPerson.Druckname.Nachname]}"
        response: eigenemeldungensuchen_request_response

      # eigeneMeldungenSuchen Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: STATUS
        action: EQUALS
        expected: "200"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: STATUS
        action: EQUALS
        expected: "500"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - DialogException (Unknown_Insert)
      # [Warning] Skipped DialogException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[AccessException.InfoCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[AccessException.ExceptionCode]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[AccessException.InfoText]}"
        response: eigenemeldungensuchen_request_response

      # MUHI Exception Response - CardException (Unknown_Insert)
      # [Warning] Skipped CardException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - MuhiException (Unknown_Insert)
      # [Warning] Skipped MuhiException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - AccessException (Unknown_Insert)
      # [Warning] Skipped AccessException. Unsupported ActionMode: Unknown_Insert

      - type: CALL
        command: "reusable.dialogclose_auth1"
        parameters:
          dialogId: "{B[dialogId]}"
