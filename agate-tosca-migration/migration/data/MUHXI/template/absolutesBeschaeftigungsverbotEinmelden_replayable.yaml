
- id: "absolutesBeschaeftigungsverbotEinmelden_replayable"
    description: "absolutesBeschaeftigungsverbotEinmelden_replayable"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "{XL[Vertragspartner.VPNR]}"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "{XL[Vertragspartner.Ord_id]}"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: "{B[B_OrdinationsId]}"
          vpNummer: "{B[B_Karte]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_svsig_e_card"
        condition: "'CardToken.SVNR-Karte' != NULL"
        parameters: 
          SvNummer: "{XL[CardToken.SVNR-Karte]}"
          VpNummer: "{XL[CardToken.VPNR]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_vpsig_o_card"
        condition: "CardToken.Tokentyp == "VPVP""
        parameters: 
          VpNummer: "{XL[CardToken.VPNR-Karte]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_svsig_o_card"
        condition: "CardToken.Tokentyp == "VPSV""
        parameters: 
          VpNummer: "{XL[CardToken.VPNR-Karte]}"
          SvNummer: "{XL[CardToken.SVNR]}"
          cardSlot: "baseContact"
      - type: BUFFER
        op: EXEC
        name: "TransactionId"
        condition: ""
        value: "{RANDOMREGEX["99999999-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{9}-[A-Z0-9]{12}-[0-9]"]}"
      - type: BUFFER
        op: EXEC
        name: "B_FileName"
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        value: "MUHI_{DATE}_{RND[5]}.pdf"

      # absolutesBeschaeftigungsverbotEinmelden Request_1 Direkte Erreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.absolutesbeschaeftigungsverboteinmelden
        response: absolutesbeschaeftigungsverboteinmelden_response
        parameters: 
          TransactionId: "{B[TransactionId]}"
          dialogId: "{XL[DialogID]}"
          commonData: "{NULL}"
          adressePatientin: "{NULL}"
          ort: "{XL[Adresse_Patientin.Ort]}"
          postleitzahl: "{XL[Adresse_Patientin.Postleitzahl]}"
          staatencode: "{XL[Adresse_Patientin.Staatencode]}"
          strasse: "{XL[Adresse_Patientin.Strasse]}"
          cardToken: "{XL[CardToken.TokenWert]}"
          voraussichtlicherGeburtstermin: "{XL[Vorraussichtlicher_Geburtstermin.Datum]}"
          vsnr: "{XL[SVPerson.SVNR]}"
          Header: "{NULL}"

      # absolutesBeschaeftigungsverbotEinmelden Response_1 - ort (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='ort']"
        action: "EQUALS"
        expected: "{XL[Adresse_Patientin.Ort]}"
        response: absolutesbeschaeftigungsverboteinmelden_response

