
- id: "anspruchPruefen"
    description: "anspruchPruefen"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "{XL[Vertragspartner.VPNR]}"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "{XL[Vertragspartner.Ord_id]}"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: "{B[B_OrdinationsId]}"
          vpNummer: "{B[B_Karte]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_svsig_e_card"
        condition: "'CardToken.SVNR-Karte' != NULL"
        parameters: 
          SvNummer: "{XL[CardToken.SVNR-Karte]}"
          VpNummer: "{XL[CardToken.VPNR]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_vpsig_o_card"
        condition: "CardToken.Tokentyp == "VPVP""
        parameters: 
          VpNummer: "{XL[CardToken.VPNR-Karte]}"
          cardSlot: "baseContact"

      - type: CALL
        command: "reusable.create_cardtoken_svsig_o_card"
        condition: "CardToken.Tokentyp == "VPSV""
        parameters: 
          VpNummer: "{XL[CardToken.VPNR-Karte]}"
          SvNummer: "{XL[CardToken.SVNR]}"
          cardSlot: "baseContact"

      # anspruchPruefen Request Direkte Errreichbarkeit
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.anspruchpruefen_request
        response: anspruchpruefen_request_response
        parameters: 
          dialogId: "{XL[DialogID]}"
          vsnr: "{XL[SVPerson.SVNR]}"
          cardToken: "{XL[CardToken.TokenWert]}"
          voraussichtlicherGeburtstermin: "{XL[Vorraussichtlicher_Geburtstermin.Datum]}"

      # anspruchPruefen Response - geburtsdatum (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='geburtsdatum']"
        action: "EQUALS"
        expected: "{XL[SVPerson.Geburtsdatum]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - titelHinten (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='titelHinten']"
        action: "EQUALS"
        expected: "{XL[SVPerson.Druckname.Titel_hinten]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - titelVorne (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='titelVorne']"
        action: "EQUALS"
        expected: "{XL[SVPerson.Druckname.Titel_vorne]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - vorname (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='vorname']"
        action: "EQUALS"
        expected: "{XL[SVPerson.Druckname.Vorname]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - vsnr (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='vsnr']"
        action: "EQUALS"
        expected: "{XL[SVPerson.SVNR]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - zuname (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='patientin']/*[local-name()='zuname']"
        action: "EQUALS"
        expected: "{XL[SVPerson.Druckname.Nachname]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - schwangerschaftswoche (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='anspruchPruefenResponse']/*[local-name()='return']/*[local-name()='schwangerschaftswoche']"
        action: "EQUALS"
        expected: "{XL[Vorraussichtlicher_Geburtstermin.Schwangerschaftswoche]}"
        response: anspruchpruefen_request_response

      # anspruchPruefen Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException == NULL AND MuhiException == NULL AND AccessException == NULL AND CardException == NULL"
        source: STATUS
        action: EQUALS
        expected: "200"
        response: anspruchpruefen_request_response

      # MUHI Exception Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: STATUS
        action: EQUALS
        expected: "500"
        response: anspruchpruefen_request_response

      # MUHI Exception Response - DialogException (Unknown_Insert)
      # [Warning] Skipped DialogException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[AccessException.InfoCode]}"
        response: anspruchpruefen_request_response

      # MUHI Exception Response - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[AccessException.ExceptionCode]}"
        response: anspruchpruefen_request_response

      # MUHI Exception Response - message (Verify)
      - type: SOAP
        op: ASSERT
        condition: "DialogException != NULL  OR MuhiException != NULL OR AccessException != NULL OR CardException != NULL"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='AccessException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[AccessException.InfoText]}"
        response: anspruchpruefen_request_response

      # MUHI Exception Response - CardException (Unknown_Insert)
      # [Warning] Skipped CardException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - MuhiException (Unknown_Insert)
      # [Warning] Skipped MuhiException. Unsupported ActionMode: Unknown_Insert

      # MUHI Exception Response - AccessException (Unknown_Insert)
      # [Warning] Skipped AccessException. Unsupported ActionMode: Unknown_Insert

      - type: CALL
        command: "reusable.dialogclose_auth1"
        parameters:
          dialogId: "{B[dialogId]}"
