steps:

      - type: BUFFER
        op: EXEC
        name: LFNR_FileTyp
        value: "{R[Parameter_1]}"


      - type: BUFFER
        op: EXEC
        name: LFNR_Filerefix
        value: "{R[Parameter_2]}"


      - type: BUFFER
        op: EXEC
        name: LFNR_BufferName
        value: "{R[Parameter_3]}"


      - type: BUFFER
        op: EXEC
        name: L_input_folder
        value: "{R[Parameter_4]}"


      # Execute CMD Command: TBox Start Program - Find-MinNNNNNNNN.bat
      - type: CMD
        op: EXEC
        command: |
            {b[ks_bin_folder]}{B[KS_Bin_Folder]}\\Find-MinNNNNNNNN.bat "{B[KS_Testdaten_BaseDir]}\\{B[L_input_folder]}\\" "{B[LFNR_FileTyp]}"
        response: cmd_response


      # Execute CMD Command: neu TBox Start Program - remove CR LF
      - type: CMD
        op: EXEC
        command: "{B[G_UMGEBUNGSSCRIPT_SCRIPT_08]} {B[G_LogDir]}\\LfNr_PROD.txt"
        response: cmd_response


      # Execute CMD Command: neu TBox Start Program - del Openshift_Log
      - type: CMD
        op: EXEC
        command: "del {B[G_LogDir]}\\LfNr_PROD.txt"
        response: cmd_response


      # Execute CMD Command: neu TBox Start Program - ren Openshift_Log_ohne_CRLF
      - type: CMD
        op: EXEC
        command: "{b[g_logdir]}ren {B[G_LogDir]}\\LfNr_PROD.txt_ohne_CRLF LfNr_PROD.txt"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File


      - type: BUFFER
        op: EXEC
        name: {B[LFNR_BufferName]}
        value: "{B[LAUFNR]}"
