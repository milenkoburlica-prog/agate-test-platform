steps:

      # Execute CMD Command: TBox Start Program  - Remove all Subfolders in TxFilesToKams
      - type: CMD
        op: EXEC
        command: |
            {b[ks_testdaten_basedir]}\txfilestokams\for /D %i in ({B[KS_Testdaten_BaseDir]}\\TxFilesToKams\\*) do rmdir /S /Q "%i\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove all Files in TxFilesToKams
      - type: CMD
        op: EXEC
        command: "{b[ks_testdaten_basedir]}\txfilestokams\del /F /Q {B[KS_Testdaten_BaseDir]}\\TxFilesToKams\\*"
        response: cmd_response
