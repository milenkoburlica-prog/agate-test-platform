        command: "-h {B[G_KS_DB_URL]} -U {B[G_KS_DB_USER]} -d {B[G_KS_DB_DSN]} -f {B[KS_Testdaten_BaseDir]}\\db_scripte\\{B[filename]}"
        response: cmd_response
