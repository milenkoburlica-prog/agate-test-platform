name: 03_openshift_logcheck
steps:

      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true')"
        name: L_Buffer_Selector
        value: "V1"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true')"
        name: L_Buffer_LogCount
        value: "BUFFER_NOT_SET"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'kvw-clv-device-import-batch')"
        name: L_Buffer_Selector
        value: "V2"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'kvw-clv-provider')"
        name: L_Buffer_Selector
        value: "V4"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'clvdeviceimport')"
        name: L_Buffer_Selector
        value: "V2"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'kvw-kams-man')"
        name: L_Buffer_Selector
        value: "V3"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'kvw-kams-aut')"
        name: L_Buffer_Selector
        value: "V3"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: ServiceCloudName
        value: "{R[ServiceCloudName]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungCode
        value: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungText
        value: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: LogTyp
        value: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: Suchkriterium2
        value: "{R[Suchkriterium2]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -t {B[LogTimeStamp]} -s .*{B[Suchkriterium2]}.*"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud _Test02 Request
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs_structured[0].level"
          value1: "{R[MeldungTyp]}"
          path2: "$.logs_structured[0].mdc['event.code']"
          value2: "{R[MeldungCode]}"
          path3: "$.logs_structured[0].mdc['event.message']"
          value3: "{R[MeldungText]}"
          path4: "$.logs_structured[0].mdc['log.type']"
          value4: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{R[ServiceCloudName]}' == 'kvw-clv')"
        name: L_Buffer_Selector
        value: "V2"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: ServiceCloudName
        value: "{R[ServiceCloudName]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: MeldungCode
        value: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: MeldungText
        value: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: LogTyp
        value: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: Suchkriterium2
        value: "{R[Suchkriterium2]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: LogCount
        value: "{R[LogCount]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1') AND ('{B[Suchkriterium2]}' == 'BUFFER_NOT_SET')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -t {B[LogTimeStamp]}"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud_Result01 INFO Messages with conditions
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1') AND ('{B[Suchkriterium2]}' == 'BUFFER_NOT_SET') AND ('{B[LogCount]}'=='BUFFER_NOT_SET')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs[0][10]"
          value1: "{R[MeldungText]}"
          path2: "$.logs[0][11]"
          value2: "{R[MeldungTyp]}"
          path3: "$.logs[0][13]"
          value3: "{R[MeldungCode]}"
          path4: "$.logs[0][14]"
          value4: "{R[MeldungText]}"
          path5: "$.logs[0][1]"
          value5: "{R[MeldungTyp]}"

      # Assert JSON Response: LogCheckCloud_Result01 LogCount
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1') AND ('{B[Suchkriterium2]}' == 'BUFFER_NOT_SET') AND (NOT (('{B[LogCount]}'=='BUFFER_NOT_SET')))"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.count"
          value1: "{B[LogCount]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1') AND (NOT (('{B[Suchkriterium2]}' == 'BUFFER_NOT_SET')))"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -s {B[Suchkriterium2]} -t {B[LogTimeStamp]}"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud_Result01 INFO Messages with conditions
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V1') AND (NOT (('{B[Suchkriterium2]}' == 'BUFFER_NOT_SET')))"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs[0][1]"
          value1: "INFO"
          path2: "$.logs[0][2]"
          value2: "{R[LogTyp]}"
          path4: "$.logs[0][9]"
          value4: "{R[Suchkriterium2]}"
          path5: "$.logs[0][12]"
          value5: "{R[MeldungTyp]}"
          path6: "$.logs[0][13]"
          value6: "{R[MeldungCode]}"
          path7: "$.logs[0][14]"
          value7: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: ServiceCloudName
        value: "{R[ServiceCloudName]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungCode
        value: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungText
        value: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: LogTyp
        value: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        name: Suchkriterium2
        value: "{R[Suchkriterium2]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -t {B[LogTimeStamp]} -s .*{B[Suchkriterium2]}.*"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud _Test02 Request
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V2')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs_structured[0].level"
          value1: "{R[MeldungTyp]}"
          path2: "$.logs_structured[0].mdc['event.code']"
          value2: "{R[MeldungCode]}"
          path3: "$.logs_structured[0].mdc['event.message']"
          value3: "{R[MeldungText]}"
          path4: "$.logs_structured[0].mdc['log.type']"
          value4: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: ServiceCloudName
        value: "{R[ServiceCloudName]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: MeldungCode
        value: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: MeldungText
        value: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: LogTyp
        value: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        name: Suchkriterium2
        value: "{R[Suchkriterium2]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -t {B[LogTimeStamp]}"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud _KAMS_V3
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V3')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs[0][1]"
          value1: "{R[MeldungTyp]}"
          path2: "$.logs[0][2]"
          value2: "{R[MeldungText]}"
          path3: "$.logs[0][3].code"
          value3: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: ServiceCloudName
        value: "{R[ServiceCloudName]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: MeldungCode
        value: "{R[MeldungCode]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: MeldungText
        value: "{R[MeldungText]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: MeldungTyp
        value: "{R[MeldungTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: LogTyp
        value: "{R[LogTyp]}"


      - type: BUFFER
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4')"
        name: Suchkriterium2
        value: "{R[Suchkriterium2]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4') AND ('{B[MeldungTyp]}' == 'INFO')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -t {B[LogTimeStamp]}"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud_Test Request INFO
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4') AND ('{B[MeldungTyp]}' == 'INFO')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs_structured[0].level"
          value1: "{R[MeldungTyp]}"
          path2: "$.logs_structured[0].message"
          value2: "{R[MeldungText]}"


      # Execute CMD Command: TBox Start Program _CMD
      - type: CMD
        op: EXEC
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4') AND ('{B[MeldungTyp]}' == 'WARN' or '{B[MeldungTyp]}' == 'ERROR')"
        command: "{E[env.openshift_logcheck_dir]}\\openshift-log-check.bat -a {B[ServiceCloudName]} -n {E[env.openShift.namespace]} -s {B[MeldungCode]} -t {B[LogTimeStamp]}"
        response: cmd_response

      # Assert JSON Response: LogCheckCloud_Test Request WARN/ERROR
      - type: JSON
        op: ASSERT
        condition: "('true' == 'true') AND ('{B[L_Buffer_Selector]}' == 'V4') AND ('{B[MeldungTyp]}' == 'WARN' or '{B[MeldungTyp]}' == 'ERROR')"
        file: "C:\\temp\\LogCheckCloud_Result01.json"
        parameters:
          path1: "$.logs_structured[0].level"
          value1: "{R[MeldungTyp]}"
          path2: "$.logs_structured[0].mdc['event.code']"
          value2: "{R[MeldungCode]}"
          path3: "$.logs_structured[0].mdc['event.message']"
          value3: "{R[MeldungText]}"
          path4: "$.logs_structured[0].mdc['log.type']"
          value4: "{R[LogTyp]}"
