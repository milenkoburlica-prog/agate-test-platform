name: start_browser_edge
steps:

      # Execute Command: TBox Start Program - EDGE beenden
      - type: CMD
        op: EXEC
        command: "/F /IM msedge* /T"
        response: cmd_response


      - type: WAIT
        value: "1500"


      # Execute CMD Command: TBox Start Program - Clean EDGE Sessions
      - type: CMD
        op: EXEC
        command: 'rmdir /S /Q "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Sessions"'
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Clean EDGE Session Storage
      - type: CMD
        op: EXEC
        command: 'rmdir /S /Q "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Session Storage"'
        response: cmd_response


      - type: WAIT
        value: "1500"
Unprocessed moduleName=OpenUrl
