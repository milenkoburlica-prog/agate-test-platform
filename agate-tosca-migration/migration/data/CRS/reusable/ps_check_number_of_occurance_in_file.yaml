name: ps_check_number_of_occurance_in_file
steps:

      - type: BUFFER
        op: EXEC
        name: oc_log_file
        value: "{R[log-file]}"


      - type: BUFFER
        op: EXEC
        name: searchString
        value: "{R[search-string]}"


      - type: BUFFER
        op: EXEC
        name: noOccurance
        value: "{R[no-occurance]}"


      - type: BUFFER
        op: EXEC
        name: logFile
        value: "oc-log.txt"


      - type: BUFFER
        op: EXEC
        name: logFolder
        value: "C:\TCLogs"


      # Execute CMD Command: TBox Start Program - execute CheckNuberOfOCccurance.ps1
      - type: CMD
        op: EXEC
        command: '{s[svc.projekt root path]}\tosca\daten\files\pst\pstsyst\test\bin{S[SVC.Projekt root path]}\\Tosca\\Daten\\Files\\pst\\pstsyst\\test\\bin\\CheckOcccurance.bat "{B[oc_log_file]}" "{B[searchString]}" {B[NoOccurance]} > {B[logFolder]}\\{B[logFile]}K'
        response: cmd_response

      # [Merged] TBox Read/Create File - check Response is handled by the Request step
