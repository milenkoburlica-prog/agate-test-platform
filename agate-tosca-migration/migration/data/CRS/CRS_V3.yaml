        endpoint: "https://{E[env.ecard.service]}/crs/3"
        command: rest.readersUrl.get_request_readersurl-v3
        response: get_request_readersurl-v3_response
        parameters: 
          X-SVC-CLIENT-IP: "{E[env.X-SVC-CLIENT-IP]}"

      # GET Response _readersUrl-V3 - id (Buffer)
