name: create_cardtoken_svsig_o_card
steps:

      - type: BUFFER
        op: EXEC
        name: GinoCardSlot
        value: "{E[users.card.slot.default]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesername
        value: "{E[users.seriennummer]}"


      - type: BUFFER
        op: EXEC
        name: KartenleserIP
        value: "{E[users.ginoip]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesersimulator
        value: "{E[users.serverip]}"


      - type: BUFFER
        op: EXEC
        name: VpNummer
        value: "{R[VpNummer]}"


      - type: BUFFER
        op: EXEC
        name: SvNummer
        value: "{R[SvNummer]}"

      - type: CALL
        command: "reusable.o_e_card_stecken"
        parameters: {}


      - type: BUFFER
        op: EXEC
        name: GinoCardSlot
        value: "{E[users.card.slot.default]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesername
        value: "{E[users.seriennummer]}"


      - type: BUFFER
        op: EXEC
        name: KartenleserIP
        value: "{E[users.ginoip]}"


      - type: BUFFER
        op: EXEC
        name: Kartenlesersimulator
        value: "{E[users.serverip]}"


      - type: BUFFER
        op: EXEC
        name: VpNummer
        value: "{R[VpNummer]}"

      # cardToken_svSig_o_card_baseContact Request
      - type: REST
        op: EXEC
        condition: "('{B[B_CardReaderSimulatorSlot]}'=='baseContact')"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_o_card_basecontact_request
        response: rest.gino.v2.status.cardtoken_svsig_o_card_basecontact_request_response

      # [Merged] cardToken_svSig_o_card_baseContact Response is handled by the Request step

      # cardToken_svSig_o_card_baseNfc Request
      - type: REST
        op: EXEC
        condition: "(NOT (('{B[B_CardReaderSimulatorSlot]}'=='baseContact'))) AND ('{B[B_CardReaderSimulatorSlot]}'=='baseNfc')"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_o_card_basenfc_request
        response: rest.gino.v2.status.cardtoken_svsig_o_card_basenfc_request_response

      # [Merged] cardToken_svSig_o_card_baseNfc Response is handled by the Request step

      # cardToken_svSig_o_card_satelliteNfc Request
      - type: REST
        op: EXEC
        condition: "(NOT (('{B[B_CardReaderSimulatorSlot]}'=='baseContact'))) AND (NOT (('{B[B_CardReaderSimulatorSlot]}'=='baseNfc')))"
        endpoint: "https://{E[users.ginoip]}"
        command: rest.gino.v2.status.cardtoken_svsig_o_card_satellitenfc_request
        response: rest.gino.v2.status.cardtoken_svsig_o_card_satellitenfc_request_response

      # [Merged] cardToken_svSig_o_card_satelliteNfc Response is handled by the Request step
