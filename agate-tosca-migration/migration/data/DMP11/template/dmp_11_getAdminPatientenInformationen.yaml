        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[DmpInvalidParameterException.InfoText]}"
        response: getadminpatienteninformationen_request_v11_response

      # DMP Exception Response V11 - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR DmpException != NULL OR DmpInvalidParameterException != NULL OR AccessException != NULL) AND (({XL[AccessException]} != NULL)))"
        source: BODY
