        op: ASSERT
        condition: "((DialogException != NULL OR DmpException != NULL OR DmpInvalidParameterException != NULL OR AccessException != NULL) AND (({XL[DmpException]} != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "{XL[DmpException.InfoText]}"
        response: getadminpatienteninformationen_request_v11_response

      # DMP Exception Response V11 - code (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR DmpException != NULL OR DmpInvalidParameterException != NULL OR AccessException != NULL) AND (({XL[DmpInvalidParameterException]} != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "{XL[DmpInvalidParameterException.InfoCode]}"
        response: getadminpatienteninformationen_request_v11_response

      # DMP Exception Response V11 - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        condition: "((DialogException != NULL OR DmpException != NULL OR DmpInvalidParameterException != NULL OR AccessException != NULL) AND (({XL[DmpInvalidParameterException]} != NULL)))"
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "{XL[DmpInvalidParameterException.ExceptionCode]}"
        response: getadminpatienteninformationen_request_v11_response

      # DMP Exception Response V11 - message (Verify)
