testCases:

- id: '001.FF: Die Anfrage muss entweder eine e-card verwendet werden oder eine Admin-Karte in Verbindung mit einer SV-Nummer (CL-05288)'
  description: getVersichertenDaten_syst_aut1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '456138'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682122'

  - type: BUFFER
    op: EXEC
    name: VPNR
    value: '{B[B_Karte]}'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.vdas.16.getversichertendaten_request
    response: getversichertendaten_request_response
    parameters:
      dialogId: '{B[dialogId]}'
      abteilungsFunktionsCode: KANN
      forceExecution: 'true'
      svNummer: '{NULL}'
      svNummerAbgeleitet: '{EMPTY}'
      svtCode: '{NULL}'
      cardToken: ''

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: getversichertendaten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='InvalidParameterVdasException']/*[local-name()='code']
    action: EQUALS
    expected: CL-05288
    response: getversichertendaten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='InvalidParameterVdasException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '15'
    response: getversichertendaten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='InvalidParameterVdasException']/*[local-name()='message']
    action: CONTAINS
    expected: Für die Anfrage muss entweder eine e-card verwendet werden oder eine Admin-Karte in Verbindung mit einer SV-Nummer.
    response: getversichertendaten_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

