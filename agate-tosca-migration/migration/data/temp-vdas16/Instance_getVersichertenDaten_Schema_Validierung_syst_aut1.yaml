testCases:

- id: '008.GF: SV_SV Tocken (SVNR-1) mit SVNR-1 im Request,Patient bei einem einzigen Träger versichert (ASVG oder Sonderversicherung)'
  description: getVersichertenDaten_Schema_Validierung_syst_aut1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '456138'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682122'

  - type: BUFFER
    op: EXEC
    name: VPNR
    value: '{B[B_Karte]}'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: CALL
    command: reusable.create_cardtoken_svsig_e_card
    parameters:
      SvNummer: '4561047149'
      VpNummer: '456138'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.vdas.16.getversichertendaten_request_schemavalidierung
    response: getversichertendaten_request_schemavalidierung_response
    parameters:
      dialogId: '{B[dialogId]}'
      abteilungsFunktionsCode: KANN
      forceExecution: 'true'
      svNummer: '4561047149'
      svNummerAbgeleitet: '{EMPTY}'
      svtCode: '{EMPTY}'
      cardToken: '{B[token]}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: getversichertendaten_request_schemavalidierung_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='faultcode']
    action: EQUALS
    expected: soap:Client
    response: getversichertendaten_request_schemavalidierung_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='faultstring']
    action: EQUALS
    expected: 'Unmarshalling Error: cvc-complex-type.3.2.2: Attribute ''x'' is not allowed to appear in element ''getVersichertenDaten''.'
    response: getversichertendaten_request_schemavalidierung_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'
