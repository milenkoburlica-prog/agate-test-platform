
  - id: "PST_Export"
    description: "PST_Export"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
 
      - type: BUFFER
        op: EXEC
        name: "TC_ID"
        condition: ""
        value: "{XL[TC_NAME]}"
 
      - type: BUFFER
        op: EXEC
        name: "tc_name"
        condition: ""
        value: "{B[TC_ID]}_{DATETIME}"
 
      - type: BUFFER
        op: EXEC
        name: "TEST_DATA_PACKET_DIR"
        condition: ""
        value: "{B[TC_ID]}"
 
      - type: BUFFER
        op: EXEC
        name: "referenze2"
        condition: ""
        value: "XX"
 
      - type: BUFFER
        op: EXEC
        name: "task"
        condition: ""
        value: "job"

      - type: CALL
        command: 'reusable.01_execute_ssh'
        parameters: 
          Option: 'buffer'
          Command: 'pst import'
          Servicename: 'kvw-pst-{B[PST_ID]}'

      - type: CALL
        command: 'reusable.database_unverarbeitete_bestände_loeschen'

      - type: CALL
        command: 'reusable.pst_xml_vuneutestnr20260101_create_1_ok__bestand'
        condition: 'Preparation.Auftrag.VUNEUTESTNR20260101.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_xml_bkfdhtestnr20260101_create_1_ok_bestand'
        condition: 'Preparation.Auftrag.STPETEST_BKFDHTESTNR20260101.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_tsv_stptetest_telemedizinischekonsultationpersonalisiert_create_1_ok_bestand'
        condition: 'Preparation.Auftrag.STPTETEST_TELEMEDIZINISCHEKONSULTATIONPERSONALISIERT.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_tsv_inpvptest_krankenanstaltenaufnahmeereignisbmgpersonalisiert_create_1_ok_bestand'
        condition: 'Preparation.Auftrag.INPVPTEST_KRANKENANSTALTENAUFNAHMEEREIGNISBMGPERSONALISIERT_1.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_tsv_dwhsttest_dwhstatpersonalisiert_create_1_ok_bestand'
        condition: 'Preparation.Auftrag.DWHSTTEST_DWHSTATPERSONALISIERT_1.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_tsv_stpdwtest_kalleistungserbringerpersonalisiert_create_1_ok_bestand'
        condition: 'Preparation.Auftrag.STPDWTEST_KALLEISTUNGSERBRINGERPERSONALISIERT.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_xml_vuneutestnr20260101_create_2_ok_ok_bestande'
        condition: 'Preparation.Auftrag.VUNEUTESTNR20260101_OK_OK.aktive == 'y''

      - type: CALL
        command: 'reusable.pst_xml_vuneutestnr20260101_create_2_ok_nok_bestande'
        condition: 'Preparation.Auftrag.VUNEUTESTNR2026010_OK_NOK.aktive == 'y''

      - type: CALL
        command: 'reusable.error_manipulacija_1_paketinfo'
        condition: 'ErrorManipulation == '1''

      - type: CALL
        command: 'reusable.error_manipulacija_2_bestand.xml'
        condition: 'ErrorManipulation == '2''

      - type: CALL
        command: 'reusable.error_manipulacija_3_xml_node'
        condition: 'ErrorManipulation == '3''

      - type: CALL
        command: 'reusable.error_manipulacija_4_xml_node'
        condition: 'ErrorManipulation == '4''

      - type: CALL
        command: 'reusable.error_manipulacija_5_xml_node'
        condition: 'ErrorManipulation == '5''
 
      - type: BUFFER
        op: EXEC
        name: "logging_path"
        condition: ""
        value: "{B[G_LogDir]}\{B[PST_ID]}\{B[TEST_DATA_PACKET_DIR]}\{B[tc_name]}"


      # Execute CMD Command: TBox Start Program - Create Logging DIR
      - type: CMD
        op: EXEC
        command: "mkdir {B[logging_path]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Copy to Logging Dir POD Log
      - type: CMD
        op: EXEC
        command: "copy {B[PST_BASE_PATH_TEMP_OUTPUT]}\\* {B[logging_path]}\\"
        response: cmd_response

      - type: CALL
        command: 'reusable.02_execute_file_transfer'
        parameters: 
          Option: 'put'
          Servicename: 'kvw-pst-{B[PST_ID]}'
          WindowsFilePath: '{B[DDAU_FILE_NAME_FOR_OC_CP]}'
          UnixFilePath: '{B[PST_VAR_DOWNLOAD_FOLDER]}'

      - type: CALL
        command: 'reusable.01_execute_ssh'
        parameters: 
          Option: 'buffer'
          Command: 'pst import'
          Servicename: 'kvw-pst-{B[PST_ID]}'

      - type: CALL
        command: 'reusable.backup_pod_log_file'
        parameters: 
          operation: 'import'
 
      - type: BUFFER
        op: EXEC
        name: "log_to_check"
        condition: ""
        value: "{B[G_LogDir]}\{B[PST_ID]}\{B[TEST_DATA_PACKET_DIR]}\{B[tc_name]}\{B[tc_name]}-pod-log-import.txt"
 
      - type: BUFFER
        op: EXEC
        name: "pitStop"
        condition: "ImportChecks.Check01.Key != NULL"
        value: "pitStop"

      - type: CALL
        command: 'reusable.03_openshift_consolecheck'
        parameters: 
          log-file: '{B[log_to_check]}'
          search-string: '{XL[ImportChecks.Check01.Key]}'
