steps:

      # Execute CMD Command: TBox Start Program - Clean output folder
      - type: CMD
        op: EXEC
        command: "del /q {B[PST_BASE_PATH_TEMP_OUTPUT]}\\*"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Clean temp folder
      - type: CMD
        op: EXEC
        command: "del /q {B[PST_BASE_PATH_TEMP_TEMP]}\\*"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Start encrypting
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_JAR_NAME]} encrypt -k {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_01]} -K {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_02]} -s {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_03]} -i {B[XML_DATEI_INPUT_01]} -o {B[PST_BASE_PATH_TEMP_OUTPUT]}\\bestand1.xml"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Start encrypting
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_JAR_NAME]} encrypt -k {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_01]} -K {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_02]} -s {B[PST_BASE_PATH_PEM]}\\{B[PEM_DATEI_03]} -i {B[XML_DATEI_INPUT_01]} -o {B[PST_BASE_PATH_TEMP_OUTPUT]}\\bestand2.xml"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Start pdg
      - type: CMD
        op: EXEC
        command: |
            java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_JAR_NAME]} pdg -d {B[PST_BASE_PATH_TEMP_OUTPUT]}\\ -i "text/xml" -k 07 -p VU -u 34 -z NY
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Get DDAU Filename
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --directory {B[PST_BASE_PATH_TEMP_OUTPUT]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove EOL
      - type: CMD
        op: EXEC
        command: "powershell -Command (Get-Content {B[G_LogDir]}\\ddaus_file_name.txt -Raw).TrimEnd([char]13,[char]10) | Set-Content {B[G_LogDir]}\\ddaus_file_name.txt -NoNewline"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File


      # Execute CMD Command: TBox Start Program - Get DDAU Filename
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --file {B[PST_BASE_PATH_TEMP_OUTPUT]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove EOL
      - type: CMD
        op: EXEC
        command: "powershell -Command (Get-Content {B[G_LogDir]}\\ddaus_file_name.txt -Raw).TrimEnd([char]13,[char]10) | Set-Content {B[G_LogDir]}\\ddaus_file_name.txt -NoNewline"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File


      # Execute CMD Command: TBox Start Program - clean temp folder
      - type: CMD
        op: EXEC
        command: "del /Q /S {B[PST_BASE_PATH_TEMP_TEMP]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - copy gz from output to temp
      - type: CMD
        op: EXEC
        command: "copy {B[PST_BASE_PATH_TEMP_OUTPUT]}\\{B[DDAU_FILE_NAME]} {B[PST_BASE_PATH_TEMP_TEMP]}\\{B[DDAU_FILE_NAME]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - unzip ddausNY frm output to temp
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --unpack {B[PST_BASE_PATH_TEMP_TEMP]}\\{B[DDAU_FILE_NAME]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - copy prepared packageinfo
      - type: CMD
        op: EXEC
        command: "copy /Y {B[PST_TEST_DATA_BASE_DIR]}\\{B[TSV_DATEI_INPUT_11]} {B[PST_BASE_PATH_TEMP_TEMP]}\\{B[TSV_DATEI_INPUT_12]}"
        response: cmd_response


      - type: BUFFER
        op: EXEC
        name: referenze1
        value: "{RND[12]}"


      # Execute CMD Command: TBox Start Program - Update ZusaetzlOrdnungsbegriff1
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --input {B[PST_BASE_PATH_TEMP_TEMP]}\\dd{B[PROJECT_KZ]}.paketinfo.xml --nodekey ZusaetzlOrdnungsbegriff --replaceplaceholder $ZusaetzlOrdnungsbegriff1 --replacewith {B[referenze2]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Update ReferenzNummer1
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --input {B[PST_BASE_PATH_TEMP_TEMP]}\\dd{B[PROJECT_KZ]}.paketinfo.xml --nodekey ReferenzNummer --replaceplaceholder $ReferenzNummer1 --replacewith {B[referenze1]}"
        response: cmd_response


      - type: BUFFER
        op: EXEC
        name: referenze2
        value: "{RND[12]}"


      # Execute CMD Command: TBox Start Program - Update ZusaetzlOrdnungsbegriff2
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --input {B[PST_BASE_PATH_TEMP_TEMP]}\\dd{B[PROJECT_KZ]}.paketinfo.xml --nodekey ZusaetzlOrdnungsbegriff --replaceplaceholder $ZusaetzlOrdnungsbegriff2 --replacewith {B[referenze2]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Update ReferenzNummer2
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --input {B[PST_BASE_PATH_TEMP_TEMP]}\\dd{B[PROJECT_KZ]}.paketinfo.xml --nodekey ReferenzNummer --replaceplaceholder $ReferenzNummer2 --replacewith {B[referenze2]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - zip ddausNY frm output to temp
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --pack {B[PST_BASE_PATH_TEMP_TEMP]} --format NY"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Get DDAU EU Filename
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --file {B[PST_BASE_PATH_TEMP_TEMP]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove EOL
      - type: CMD
        op: EXEC
        command: "powershell -Command (Get-Content {B[G_LogDir]}\\ddaus_file_name_neu.txt -Raw).TrimEnd([char]13,[char]10) | Set-Content {B[G_LogDir]}\\ddaus_file_name_neu.txt -NoNewline"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File


      # Execute CMD Command: TBox Start Program - Copy file
      - type: CMD
        op: EXEC
        command: "copy /Y {B[PST_BASE_PATH_TEMP_TEMP]}\\{B[DDAU_FILE_NAME_NEU]} {B[PST_BASE_PATH_TEMP_OUTPUT]}\\{B[DDAU_FILE_NAME]}"
        response: cmd_response
