steps:

      # Execute CMD Command: TBox Start Program - Clean output folder
      - type: CMD
        op: EXEC
        command: "del /q {B[PST_BASE_PATH_TEMP_OUTPUT]}\\*"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Start encrypting
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_JAR_NAME]} encryptnoxml -i {B[TSV_DATEI_INPUT_05]} -o {B[PST_BASE_PATH_TEMP_OUTPUT]} -O bestandmdif5.tar.gz"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Copy ddNY.paketinfo-no-sig.xml
      - type: CMD
        op: EXEC
        command: "copy {B[PST_BASE_PATH_DATEI]}\\{B[TSV_DATEI_INPUT_08]} {B[PST_BASE_PATH_TEMP_OUTPUT]}\\{B[TSV_DATEI_INPUT_08]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Update Referneznummer in dd39.paketinfo-no-sig.xml
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --input {B[PST_BASE_PATH_TEMP_OUTPUT]}\\{B[TSV_DATEI_INPUT_08]} --nodekey BestandsInfo.ReferenzNummer --nodevalue {RND[12]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Start pdg
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_JAR_NAME]} pdg -d {B[PST_BASE_PATH_TEMP_OUTPUT]}\\ -k NY -p SM -u 30 -z NY -P {B[TSV_DATEI_INPUT_08]}"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Get DDAU Filename
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --directory {B[PST_BASE_PATH_TEMP_OUTPUT]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove EOL
      - type: CMD
        op: EXEC
        command: "powershell -Command (Get-Content {B[G_LogDir]}\\ddaus_file_name.txt -Raw).TrimEnd([char]13,[char]10) | Set-Content {B[G_LogDir]}\\ddaus_file_name.txt -NoNewline"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File


      # Execute CMD Command: TBox Start Program - Get DDAU Filename
      - type: CMD
        op: EXEC
        command: "java -jar {B[PST_BASE_PATH_BIN]}\\{B[PST_SIMU_HELPER_JAR_NAME]} --file {B[PST_BASE_PATH_TEMP_OUTPUT]}\\"
        response: cmd_response


      # Execute CMD Command: TBox Start Program - Remove EOL
      - type: CMD
        op: EXEC
        command: "powershell -Command (Get-Content {B[G_LogDir]}\\ddaus_file_name.txt -Raw).TrimEnd([char]13,[char]10) | Set-Content {B[G_LogDir]}\\ddaus_file_name.txt -NoNewline"
        response: cmd_response
Unprocessed moduleName=TBox Read/Create File
