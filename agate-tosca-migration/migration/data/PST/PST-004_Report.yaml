testCases: 

  - id: "PST_REPORT_GF_001_with_default_output_filename"
    description: "PST_REPORT_GF_001_with_default_output_filename"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
 
      - type: BUFFER
        op: EXEC
        name: "TC_ID"
        condition: ""
        value: "PST_REPORT_GF_001"
 
      - type: BUFFER
        op: EXEC
        name: "tc_name"
        condition: ""
        value: "{B[TC_ID]}_{DATETIME}"
 
      - type: BUFFER
        op: EXEC
        name: "TEST_DATA_PACKET_DIR"
        condition: ""
        value: "{B[TC_ID]}"
 
      - type: BUFFER
        op: EXEC
        name: "referenze2"
        condition: ""
        value: "XX"
 
      - type: BUFFER
        op: EXEC
        name: "task"
        condition: ""
        value: "job"
 
      - type: BUFFER
        op: EXEC
        name: "logging_path"
        condition: ""
        value: "{B[G_LogDir]}\{B[PST_ID]}\{B[TEST_DATA_PACKET_DIR]}\{B[tc_name]}"


      # Execute CMD Command: TBox Start Program - Create Logging DIR
      - type: CMD
        op: EXEC
        command: "mkdir {B[logging_path]}"
        response: cmd_response

      - type: CALL
        command: 'reusable.01_execute_ssh'
        parameters: 
          Option: 'verify-no'
          Command: 'rm {B[PST_OUTPUT_FOLDER]}/report.txt'
          Servicename: 'kvw-pst-{B[PST_ID]}'
          Verify: ''

      - type: CALL
        command: 'reusable.01_execute_ssh'
        parameters: 
          Option: 'verify-contains'
          Command: 'pst report -dateFrom={DATE[][][yyyyMM]}01 -dateTo={DATE[][][yyyyMM]}30;echo $?'
          Servicename: 'kvw-pst-{B[PST_ID]}'
          Verify: '0'

      - type: CALL
        command: 'reusable.02_execute_file_transfer'
        parameters: 
          Option: 'get'
          Servicename: 'kvw-pst-{B[PST_ID]}'
          WindowsFilePath: '{B[logging_path]}'
          UnixFilePath: '{B[PST_OUTPUT_FOLDER]}\report.txt'

      - type: CALL
        command: 'reusable.01_execute_ssh'
        parameters: 
          Option: 'verify-exact'
          Command: 'ls -ltr {B[PST_OUTPUT_FOLDER]}/report.txt | wc -l'
          Servicename: 'kvw-pst-{B[PST_ID]}'
          Verify: '1'

