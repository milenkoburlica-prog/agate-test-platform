testCases:

- id: valid
  description: getBesondereArbeitsunfaehigkeitsursacheCodes_V8_SYST_AUT1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '293197'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682599'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.aum.8.getbesonderearbeitsunfaehigkeitsursachecodes_request
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response
    parameters:
      dialogId: '{B[dialogId]}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '200'
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='bezeichnung']
    action: EQUALS
    expected: Selbstbeschädigung
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='code']
    action: EQUALS
    expected: '001'
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='bezeichnung']
    action: EQUALS
    expected: strafbare Handlung
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='code']
    action: EQUALS
    expected: '002'
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='bezeichnung']
    action: EQUALS
    expected: Raufhandel, Trunkenheit, Suchtgift
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='getBesondereArbeitsunfaehigkeitsursacheCodesResponse']/*[local-name()='return']/*[local-name()='code']
    action: EQUALS
    expected: '003'
    response: getbesonderearbeitsunfaehigkeitsursachecodes_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

