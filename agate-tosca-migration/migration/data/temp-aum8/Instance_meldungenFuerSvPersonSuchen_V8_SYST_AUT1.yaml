    response: meldungenfuersvpersonsuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: meldungenfuersvpersonsuchen_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

