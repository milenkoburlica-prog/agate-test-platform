  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.aum.8.meldungenfuersvpersonsuchen_request
    response: meldungenfuersvpersonsuchen_request_response
    parameters:
      cardToken: '{B[token]}'
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      erstellungAb: '{DATE[][][]}'
      erstellungBis: '{DATE[][][]}'
      meldungsart: AL
      svNummer: '{EMPTY}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: meldungenfuersvpersonsuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
