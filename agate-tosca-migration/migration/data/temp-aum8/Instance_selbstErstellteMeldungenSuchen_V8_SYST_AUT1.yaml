testCases:

- id: 'Fehlerfall: DialogId Länge (33)'
  description: selbstErstellteMeldungenSuchen_V8_SYST_AUT1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: SQL
    op: EXEC
    command: DELETE FROM AUM_TRANSPORT WHERE (AUFM_ID, AUFM_VERSION) IN (SELECT AUFM_ID, VERSION FROM AU_MELDUNG where AKT_VERSION= '1'and STORNO_KZ <>'1'and lastchange >=sysdate-186)
    response: lösche_aufmeldunege_-_aum_transport_res

  - type: SQL
    op: EXEC
    command: DELETE FROM AU_MELDUNG where AKT_VERSION= '1'and STORNO_KZ <>'1'and lastchange >=sysdate-186
    response: lösche_aufmeldunege_-_au_meldung__res

  - type: CALL
    command: reusable.prüfen_keine_meldung_storno_kz_0_6_monate_186_tage_vorhanden

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '293197'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682599'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.aum.8.selbsterstelltemeldungensuchen_request
    response: selbsterstelltemeldungensuchen_request_response
    parameters:
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      erstellungAb: '{DATE[][][]}'
      erstellungBis: '{DATE[][][]}'
      meldungsart: AL
      svNummer: '{EMPTY}'
      vorname: '{EMPTY}'
      zuname: '{EMPTY}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: selbsterstelltemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
    action: EQUALS
    expected: CL-01085
    response: selbsterstelltemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '1'
    response: selbsterstelltemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: selbsterstelltemeldungensuchen_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

  - type: CALL
    command: reusable.db_lösche_alle_meldungen_von_heute_de

