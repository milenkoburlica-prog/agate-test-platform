- id: 'Fehlerfall: DialogId Länge (33)'
  description: meldungStornieren_V8_SYST_AUT1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '293197'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682599'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
