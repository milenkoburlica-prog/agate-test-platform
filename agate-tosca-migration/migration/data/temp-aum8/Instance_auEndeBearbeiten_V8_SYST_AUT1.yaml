- id: 'Fehlerfall: Länge (33)'
  description: auEndeBearbeiten_V8_SYST_AUT1
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '293197'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682599'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: CALL
    command: reusable.erzeuge_basisdaten_ohne_create_close_dialog_aum8_auth1_bp
    parameters:
      Meldungsnummer: '6'

  - type: CALL
    command: reusable.create_cardtoken_svsig_e_card
    parameters:
      SvNummer: '2930049109'
      VpNummer: '293197'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.aum.8.auendebearbeiten_request
    response: auendebearbeiten_request_response
    parameters:
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      cardToken: '{B[token]}'
      aufId: '{B[MeldungsID6]}'
      aufIdVersion: '1'
      arbeitsunfaehigBis: '{DATE[][][]}'
      forceExecution: 'false'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: auendebearbeiten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
    action: EQUALS
    expected: CL-01085
    response: auendebearbeiten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '1'
    response: auendebearbeiten_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: auendebearbeiten_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

  - type: CALL
    command: reusable.db_lösche_alle_meldungen_von_heute_de

