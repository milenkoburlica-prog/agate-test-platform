  - id: "5)_TC_400_Bad_Request_FF"
    description: "5) TC 400 Bad Request FF"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "cin"
        condition: ""
        value: "8004000001600005186"

      # GET Request
      - type: REST
