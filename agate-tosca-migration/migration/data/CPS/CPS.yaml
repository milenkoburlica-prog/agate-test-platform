        op: ASSERT
        source: BODY
        path: "issues[*].name"
        action: "EQUALS"
        expected: "cin"
        response: get_request_response

      # GET Response _ERROR - value (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "issues[*].value"
        action: "EQUALS"
        expected: "{B[cin]}"
        response: get_request_response

      # GET Response _ERROR - instance (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "instance"
        action: "EQUALS"
        expected: "/cps/v1/cards/{B[cin]}/"
        response: get_request_response

