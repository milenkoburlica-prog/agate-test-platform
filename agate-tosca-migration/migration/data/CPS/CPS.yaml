      # GET Response _ERROR - StatusCode (Verify)
      - type: REST
        op: ASSERT
        source: STATUS
        action: EQUALS
        expected: "400"
        response: get_request_response

      # GET Response _ERROR - type (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "issues[*].type"
        action: "EQUALS"
        expected: "urn:problem-type:belgif:input-validation:schemaViolation"
        response: get_request_response

      # GET Response _ERROR - href (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "href"
        action: "EQUALS"
        expected: "https://www.belgif.be/specification/rest/api-guide/problems/badRequest.html"
