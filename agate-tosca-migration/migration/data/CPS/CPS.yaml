      # GET Response _ERROR - title (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "issues[*].title"
        action: "EQUALS"
        expected: "Input value is invalid with respect to the schema"
        response: get_request_response

      # GET Response _ERROR - status (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "status"
        action: "EQUALS"
        expected: "400"
        response: get_request_response

      # GET Response _ERROR - detail (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "issues[*].detail"
        action: "EQUALS"
        expected: |
            CIN is not in a valid format (^"[0-9"]"{20"}$).
        response: get_request_response

      # GET Response _ERROR - in (Verify)
      - type: REST
        op: ASSERT
        source: BODY
        path: "issues[*].in"
        action: "EQUALS"
        expected: "path"
        response: get_request_response

      # GET Response _ERROR - name (Verify)
