        op: ASSERT
        condition: "('Durchführung.POST createProvision_Response.StatusCode' != "200 OK" OR 'Durchführung.POST createProvision_Response.StatusCode' != NULL) AND ('Durchführung.POST createProvision_Request.AKTIV' != NULL)"
        source: BODY
        path: "issues[*].title"
        action: "EQUALS"
        expected: "{XL[Durchführung.POST createProvision_Response.ERROR_Response.issues.title]}"
        response: post_createprovision_request_response

      # POST createProvision Response ERROR - status (Verify)
      - type: REST
        op: ASSERT
        condition: "('Durchführung.POST createProvision_Response.StatusCode' != "200 OK" OR 'Durchführung.POST createProvision_Response.StatusCode' != NULL) AND ('Durchführung.POST createProvision_Request.AKTIV' != NULL)"
        source: BODY
        path: "status"
        action: "EQUALS"
        expected: "{XL[Durchführung.POST createProvision_Response.ERROR_Response.status]}"
