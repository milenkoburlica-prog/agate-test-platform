      - type: REST
        op: ASSERT
        condition: "('Durchführung.POST createProvision_Response.StatusCode' != "200 OK" OR 'Durchführung.POST createProvision_Response.StatusCode' != NULL) AND ('Durchführung.POST createProvision_Request.AKTIV' != NULL)"
        source: BODY
        path: "issues[*].name"
        action: "EQUALS"
        expected: "{XL[Durchführung.POST createProvision_Response.ERROR_Response.issues.name]}"
        response: post_createprovision_request_response

      # POST createProvision Response ERROR - value (Verify)
      - type: REST
