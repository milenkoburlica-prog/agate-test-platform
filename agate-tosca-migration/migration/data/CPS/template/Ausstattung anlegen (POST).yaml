        op: ASSERT
        condition: "Durchführung.Response_createProvision.StatusCode == "201 Created" AND Durchführung.Response_createProvision.Response.connectionNumber != "False""
        source: STATUS
        action: EQUALS
        expected: "{XL[Durchführung.Response_createProvision.StatusCode]}"
