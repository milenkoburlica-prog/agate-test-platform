
    - id: "Ausstattung_anlegen_(POST)"
      description: "Ausstattung anlegen (POST)"
      stage: "*"
      priority: HIGH
    variables: 
      {}
  
    steps: 
        - type: BUFFER
          op: EXEC
          name: "URL"
          condition: ""
          value: "https://ecs-webapps-{E[env.openShift.namespace]}.ecs.ocp-stag.cloud.svc.co.at"
        - type: BUFFER
          op: EXEC
          name: "contractPartnerNumber"
          condition: ""
          value: "{XL[Durchführung.Request_createProvision.contractPartnerNumber]}"
        - type: BUFFER
          op: EXEC
          name: "ordinationNumber"
          condition: ""
          value: "{XL[Durchführung.Request_createProvision.ordinationNumber]}"

      - type: CALL
        command: "reusable.tokenerstellung"
        parameters: 
          tokenProvider: "{XL[Vorbereitung.script SVC]}"
        - type: BUFFER
          op: EXEC
          name: "token_SVC"
          condition: "'Vorbereitung.script SVC' != NULL"
          value: "{B[token]}"

      - type: CALL
        command: "reusable.tokenerstellung"
        parameters: 
          tokenProvider: "{XL[Vorbereitung.script A1]}"
        - type: BUFFER
          op: EXEC
          name: "token_A1"
          condition: "'Vorbereitung.script A1' != NULL"
          value: "{B[token]}"

      - type: CALL
        command: "reusable.tokenerstellung"
        parameters: 
          tokenProvider: "{XL[Vorbereitung.script Infotech]}"
        - type: BUFFER
          op: EXEC
          name: "token_Infotech"
          condition: "'Vorbereitung.script Infotech' != NULL"
          value: "{B[token]}"


  
      # Execute SQL Query
        - type: SQL
          op: EXEC
          condition: "Vorbereitung.SQL_Statement_FK != NULL"
          command: "{XL[Vorbereitung.SQL_Statement_FK]}"
          response: tbox_db_expert_module__fk_res



  
      # Execute SQL Query
        - type: SQL
          op: EXEC
          condition: "Vorbereitung.SQL_Statement != NULL"
          command: "{XL[Vorbereitung.SQL_Statement]}"
          response: tbox_db_expert_module_res

        - type: BUFFER
          op: EXEC
          name: "contractPartnerNumber"
          condition: ""
          value: "{XL[Durchführung.Request_createProvision.contractPartnerNumber]}"
        - type: BUFFER
