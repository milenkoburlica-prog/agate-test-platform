testCases: 

  - id: "Gutfall:_Ungültige_SvNummer_angegeben._Liefert_keinen_Fehler_weil_SVNR_gültige_Prüfziffer_hat"
    description: "Gutfall: Ungültige SvNummer angegeben. Liefert keinen Fehler weil SVNR gültige Prüfziffer hat"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "645031"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "15682076"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: "baseContact"

      # isDMPPatient Request V11
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.dmp.11.isdmppatient_request_v11
        response: isdmppatient_request_v11_response
        parameters: 
          dialogId: "{B[dialogId]}"
          svNummer: "0000000000"

      # isDMPPatient Response V11 - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        source: STATUS
        action: EQUALS
        expected: "200"
        response: isdmppatient_request_v11_response

      # isDMPPatient Response V11 - return (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='isDMPPatientResponse']/*[local-name()='return']"
        action: "EQUALS"
        expected: "false"
        response: isdmppatient_request_v11_response

      - type: CALL
        command: "reusable.dialogclose_auth1"
        parameters:
          dialogId: "{B[dialogId]}"

  - id: "Schlechtfall:_Ungültige_SvNummer_angegeben_CL-02003"
    description: "Schlechtfall: Ungültige SvNummer angegeben CL-02003"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "645031"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "15682076"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: '{B[B_OrdinationsId]}'
          vpNummer: '{B[B_Karte]}'
          cardSlot: "baseContact"

      # isDMPPatient Request V11
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.dmp.11.isdmppatient_request_v11
        response: isdmppatient_request_v11_response
        parameters: 
          dialogId: "{B[dialogId]}"
          svNummer: "aaaabbccdd"

      # DMP Exception Response V11 - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        source: STATUS
        action: EQUALS
        expected: "500"
        response: isdmppatient_request_v11_response

      # DMP Exception Response V11 - code (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='code']"
        action: "EQUALS"
        expected: "CL-02003"
        response: isdmppatient_request_v11_response

      # DMP Exception Response V11 - errorCode (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='errorCode']"
        action: "EQUALS"
        expected: "3"
        response: isdmppatient_request_v11_response

      # DMP Exception Response V11 - message (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='message']"
        action: "CONTAINS"
        expected: "Der Wert in SV-Nummer ist ungültig oder fehlt."
        response: isdmppatient_request_v11_response

      - type: CALL
        command: "reusable.dialogclose_auth1"
        parameters:
          dialogId: "{B[dialogId]}"

