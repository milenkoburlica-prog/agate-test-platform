testCases: 

- id: "OclMUHI_SS12_Token_Null,_SVN-Eingabe,_Adresse_min_GF"
    description: "OclMUHI_SS12 Token Null, SVN-Eingabe, Adresse_min_GF"
    stage: "*"
    priority: HIGH
    variables: 
      {}

    steps: 
      - type: BUFFER
        op: EXEC
        name: "B_Karte"
        condition: ""
        value: "336010"
      - type: BUFFER
        op: EXEC
        name: "B_OrdinationsId"
        condition: ""
        value: "15682607"

      - type: CALL
        command: "reusable.ru_dialog_aufbau_mit_ordid"
        parameters: 
          ORD_ID: "{B[B_OrdinationsId]}"
          vpNummer: "{B[B_Karte]}"
          cardSlot: "baseContact"
      - type: BUFFER
        op: EXEC
        name: "B_FileName"
        condition: ""
        value: "MUHI_{DATE}_{RND[5]}.pdf"

      # absolutesBeschaeftigungsverbotEinmelden Request
      - type: SOAP
        op: EXEC
        endpoint: "https://{E[env.ecard.service]}"
        command: soap.muhi.1.absolutesbeschaeftigungsverboteinmelden
        response: absolutesbeschaeftigungsverboteinmelden_response
        parameters: 
          dialogId: "{B[dialogId]}"
          ort: "A"
          postleitzahl: "101"
          staatencode: "NLD"
          strasse: "A"
          voraussichtlicherGeburtstermin: "{DATE[][+84d][]}"
          vsnr: "3364013041"
          Header: "{NULL}"
          commonData: "{NULL}"
          TransactionId: "3d001cef-a9c3-4c72-be8e-0ae91226aa90"
          cardToken: "cardToken1"

      # absolutesBeschaeftigungsverbotEinmelden Response - ort (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='ort']"
        action: "EQUALS"
        expected: "A"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - postleitzahl (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='postleitzahl']"
        action: "EQUALS"
        expected: "101"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - staatencode (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='staatencode']"
        action: "EQUALS"
        expected: "NLD"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - strasse (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='strasse']"
        action: "EQUALS"
        expected: "A"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - erstellungszeitpunkt (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='erstellungszeitpunkt']"
        action: "EXISTS"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - meldungsId (Buffer)
      - type: SOAP
        op: BUFFER
        name: B_meldungsId
        source: BODY
        selector: JSON_PATH
        path: "$.meldungsId"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - geburtsdatum (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='patientin']/*[local-name()='geburtsdatum']"
        action: "EQUALS"
        expected: "26.04.1954"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - vsnr (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='patientin']/*[local-name()='vsnr']"
        action: "EQUALS"
        expected: "3364013041"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - vorname (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='patientin']/*[local-name()='vorname']"
        action: "EQUALS"
        expected: "Ludmilla"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - zuname (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='patientin']/*[local-name()='zuname']"
        action: "EQUALS"
        expected: "Łódź-MUHI-SS12"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - voraussichtlicherGeburtstermin (Verify)
      - type: SOAP
        op: ASSERT
        source: BODY
        path: "/*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='voraussichtlicherGeburtstermin']"
        action: "EQUALS"
        expected: "{DATE[][+84d][]}"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # absolutesBeschaeftigungsverbotEinmelden Response - StatusCode (Verify)
      - type: SOAP
        op: ASSERT
        source: STATUS
        action: EQUALS
        expected: "200"
        response: absolutesbeschaeftigungsverboteinmelden_response

      # Execute SQL Query
      - type: SQL
        op: EXEC
        command: "SELECT * FROM MH_MELDUNG where ID='{B[B_meldungsId]}'"
        response: prüfe_meldung_in_db_res


      # DB Check: FK_SV_NUMMER
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "3364013041"
        row: "1"
        column: "FK_SV_NUMMER"
        response: prüfe_meldung_in_db_res


      # DB Check: TYP
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "A"
        row: "1"
        column: "TYP"
        response: prüfe_meldung_in_db_res


      # DB Check: PATIENTIN_STRASSE
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "A"
        row: "1"
        column: "PATIENTIN_STRASSE"
        response: prüfe_meldung_in_db_res


      # DB Check: PATIENTIN_PLZ
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "101"
        row: "1"
        column: "PATIENTIN_PLZ"
        response: prüfe_meldung_in_db_res


      # DB Check: PATIENTIN_ORT
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "A"
        row: "1"
        column: "PATIENTIN_ORT"
        response: prüfe_meldung_in_db_res


      # DB Check: PATIENTIN_STAAT
      - type: SQL
        op: ASSERT
        action: EQUALS
        expected: "NLD"
        row: "1"
        column: "PATIENTIN_STAAT"
        response: prüfe_meldung_in_db_res


      - type: CALL
        command: "reusable.dialogclose_auth1"
        parameters:
          dialogId: "{B[dialogId]}"
