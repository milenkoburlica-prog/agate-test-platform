testCases:

- id: 'Gutfall: Ausschreibegrund AV'
  description: dmp_11_doAusschreibung
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: CALL
    command: reusable.db_dmp_delete_dmp_patient
    parameters:
      VSNR: '6458010531'

  - type: CALL
    command: reusable.soap_ss30_schreibedmppatientein
    parameters:
      VSNR: '6458010531'
      VPNR: '645026'
      EingabeArtCode: Einschreibung
      SVT: '12'
      Fachgebiet: '01'
      ProgrammCode: '01'
      BEAntragsdatum: '{DATE[][][yyyy-MM-dd]}'
      EingabeArtUebersteuert_Bool: 'false'

  - type: CALL
    command: reusable.db_dmp_isdmppatienteingeschrieben
    parameters:
      FK_SV_NUMMER: '6458010531'
      DMP_CODE: '01'

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '645026'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682075'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: BUFFER
    op: EXEC
    name: token
    value: '{EMPTY}'

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '6458010531'

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '645026'

  - type: CALL
    command: reusable.create_cardtoken_svsig_e_card
    parameters:
      SvNummer: '6458010531'
      VpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: CALL
    command: reusable.db_dmp_isdmppatienteingeschrieben
    parameters:
      FK_SV_NUMMER: '6458010531'
      DMP_CODE: '01'

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.dmp.11.doausschreibung_request_v11
    response: doausschreibung_request_v11_response
    parameters:
      dialogId: '{B[dialogId]}'
      ausschreibeGrund: AV
      dmpCode: '01'
      svNummer: '{NULL}'
      cardToken: '{B[token]}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '200'
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='ausschreibeStatus']
    action: EQUALS
    expected: Ein
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='ausschreibeZeitstempel']
    action: CONTAINS
    expected: '{DATE[][][dd.MM.yyyy HH:]}'
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='dmpCode']
    action: EQUALS
    expected: '01'
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='geburtsdatum']
    action: EQUALS
    expected: 23.11.1940
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='geschlecht']
    action: EQUALS
    expected: W
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='nachname']
    action: EQUALS
    expected: Hubermeister-DMP-SS12
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='svNummer']
    action: EQUALS
    expected: '6458010531'
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='titelVorne']
    action: EQUALS
    expected: Mag.
    response: doausschreibung_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='doAusschreibungResponse']/*[local-name()='return']/*[local-name()='patient']/*[local-name()='vorname']
    action: EQUALS
    expected: Coelestine
    response: doausschreibung_request_v11_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

  - type: CALL
    command: reusable.db_dmp_delete_dmp_patient
    parameters:
      VSNR: '6458010531'

