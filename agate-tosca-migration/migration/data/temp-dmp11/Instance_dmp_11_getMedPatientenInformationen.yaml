testCases:

- id: 'Gutfall: Ungültige SvNummer angegeben. Kein Fehler weil die SV-Nummer eine gültige Prüfzimmer hat'
  description: dmp_11_getMedPatientenInformationen
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: CALL
    command: reusable.db_dmp_delete_dmp_patient
    parameters:
      VSNR: '{NULL}'

  - type: CALL
    command: reusable.soap_ss30_schreibedmppatientein
    parameters:
      VSNR: '{NULL}'
      VPNR: '645031'
      EingabeArtCode: Einschreibung
      SVT: '{NULL}'
      Fachgebiet: '{NULL}'
      ProgrammCode: '{NULL}'
      BEAntragsdatum: '{DATE[][][yyyy-MM-dd]}'
      EingabeArtUebersteuert_Bool: 'false'

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '645031'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682076'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.dmp.11.getmedpatienteninformationen_request_v11
    response: getmedpatienteninformationen_request_v11_response
    parameters:
      dialogId: '{B[dialogId]}'
      svNummer: '0000000000'
      strukturierteMeldung: 'false'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '200'
    response: getmedpatienteninformationen_request_v11_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

