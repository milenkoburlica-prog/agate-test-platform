      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.dmp.11.getmedpatienteninformationen_request_v11
    response: getmedpatienteninformationen_request_v11_response
    parameters:
      dialogId: '{B[dialogId]}'
      svNummer: aaaabbccdd
      strukturierteMeldung: 'false'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: getmedpatienteninformationen_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='code']
    action: EQUALS
    expected: CL-02003
    response: getmedpatienteninformationen_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '3'
    response: getmedpatienteninformationen_request_v11_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DmpInvalidParameterException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Wert in SV-Nummer ist ungültig oder fehlt.
    response: getmedpatienteninformationen_request_v11_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

