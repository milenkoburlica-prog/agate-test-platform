testCases:

- id: 'Fehlerfall: DialogId Länge (33)'
  description: meldungStornieren
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '336010'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682607'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SQL
    op: BUFFER
    name: B_VSNR
    row: '0'
    column: FK_SV_NUMMER
    response: suche_meldung_in_db_res

  - type: SQL
    op: BUFFER
    name: B_Strasse
    row: '0'
    column: PATIENTIN_STRASSE
    response: suche_meldung_in_db_res

  - type: SQL
    op: BUFFER
    name: B_Plz
    row: '0'
    column: PATIENTIN_PLZ
    response: suche_meldung_in_db_res

  - type: SQL
    op: BUFFER
    name: B_Ort
    row: '0'
    column: PATIENTIN_ORT
    response: suche_meldung_in_db_res

  - type: SQL
    op: BUFFER
    name: B_Staatencode
    row: '0'
    column: PATIENTIN_STAAT
    response: suche_meldung_in_db_res

  - type: SQL
    op: BUFFER
    name: B_meldungsId
    row: '0'
    column: ID
    response: suche_meldung_in_db_res

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.muhi.1.meldungstornieren_request
    response: meldungstornieren_request_response
    download:
    - method: MTOM
      targetPath: ..\Tosca\Daten\Files\MUHI\{B[B_FileName]}
    parameters:
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      meldungsId: '1'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: meldungstornieren_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
    action: EQUALS
    expected: CL-01085
    response: meldungstornieren_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '1'
    response: meldungstornieren_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: meldungstornieren_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

