testCases:

- id: 'Fehlerfall: DialogId Länge (33)'
  description: eigeneMeldungenSuchen
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: CALL
    command: reusable.deletemeldungenfromvpnr_bp
    parameters:
      VPNR: '336010'

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '336010'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682607'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SQL
    op: EXEC
    command: UPDATE MH_MELDUNG SET ERSTELLUNGS_ZEITPUNKT=to_date('{NULL}', 'DD-MM-YYYY hh24:mi:ss') where ID='{B[B_meldungsId]}'
    response: setze_erstellungsdatum_in_db_res

  - type: SQL
    op: EXEC
    command: UPDATE MH_MELDUNG SET STORNIERT_AM=to_date('{DATETIME[][][dd-MM-yyyy hh:mm:ss]}', 'DD-MM-YYYY hh24:mi:ss') where ID='{B[B_meldungsId]}'
    response: storniere_meldung_in_db_res

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.muhi.1.eigenemeldungensuchen_request
    response: eigenemeldungensuchen_request_response
    parameters:
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      art: '{NULL}'
      erstelltAb: '{NULL}'
      erstelltBis: '{NULL}'
      typ: '{NULL}'
      voraussichtlicherGeburtsterminAb: '{NULL}'
      voraussichtlicherGeburtsterminBis: '{NULL}'
      vsnr: '{NULL}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: eigenemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
    action: EQUALS
    expected: CL-01085
    response: eigenemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '1'
    response: eigenemeldungensuchen_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: eigenemeldungensuchen_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

