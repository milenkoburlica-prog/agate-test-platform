testCases:

- id: 'Fehlerfall: DialogId Länge (33)'
  description: individuellesBeschaeftigungsverbotEinmelden
  stage: '*'
  priority: HIGH
  variables: {}
  steps:

  - type: BUFFER
    op: EXEC
    name: B_Karte
    value: '336010'

  - type: BUFFER
    op: EXEC
    name: B_OrdinationsId
    value: '15682607'

  - type: CALL
    command: reusable.ru_dialog_aufbau_mit_ordid
    parameters:
      ORD_ID: '{B[B_OrdinationsId]}'
      vpNummer: '{B[B_Karte]}'
      cardSlot: baseContact

  - type: SOAP
    op: EXEC
    endpoint: https://{E[env.ecard.service]}
    command: soap.muhi.1.individuellesbeschaeftigungsverboteinmelden_request
    response: individuellesbeschaeftigungsverboteinmelden_request_response
    download:
    - method: MTOM
      targetPath: ..\Tosca\Daten\Files\MUHI\{B[B_FileName]}
    parameters:
      dialogId: Mj00rinv1nfRMji2KbgKwwGCnbhGRwAAhU
      beginnIndividuellesBeschaeftigungsverbot: '{NULL}'
      begruendung: '{NULL}'
      begruendungVordatierung: '{NULL}'
      ort: '{NULL}'
      postleitzahl: '{NULL}'
      staatencode: '{NULL}'
      strasse: '{NULL}'
      cardToken: ''
      voraussichtlicherGeburtstermin: '{NULL}'
      vsnr: '{NULL}'
      dauer: '{NULL}'
      kzDauerBisAbsolut: '{NULL}'
      zusatzbegruendung: '{NULL}'

  - type: SOAP
    op: ASSERT
    source: STATUS
    action: EQUALS
    expected: '500'
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='code']
    action: EQUALS
    expected: CL-01085
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='errorCode']
    action: EQUALS
    expected: '1'
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='DialogException']/*[local-name()='message']
    action: CONTAINS
    expected: Der Dialog ist ungültig. Bitte melden Sie sich erneut an.
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='MuhiException']/*[local-name()='code']
    action: EQUALS
    expected: |
      {REGEX["ZS-3301210|ZS-3300014"]}
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='Fault']/*[local-name()='detail']/*[local-name()='MuhiException']/*[local-name()='message']
    action: EQUALS
    expected: |
      {REGEX["Der Wert in voraussichtlicher Geburtstermin ist ungültig|Für die Patientin kann kein individuelles Beschäftigungsverbot eingemeldet werden, weil bereits das absolute Beschäftigungsverbot in Kraft ist"]}
    response: individuellesbeschaeftigungsverboteinmelden_request_response

  - type: CALL
    command: reusable.dialogclose_auth1
    parameters:
      dialogId: '{B[dialogId]}'

