    response: absolutesbeschaeftigungsverboteinmelden_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='staatencode']
    action: EQUALS
    expected: NLD
    response: absolutesbeschaeftigungsverboteinmelden_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='adressePatientin']/*[local-name()='strasse']
    action: EQUALS
    expected: A
    response: absolutesbeschaeftigungsverboteinmelden_response

  - type: SOAP
    op: ASSERT
    source: BODY
    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='erstellungszeitpunkt']
