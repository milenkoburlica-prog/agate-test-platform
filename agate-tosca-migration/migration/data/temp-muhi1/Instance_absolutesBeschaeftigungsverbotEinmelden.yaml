    path: /*[local-name()='Envelope']/*[local-name()='Body']/*[local-name()='absolutesBeschaeftigungsverbotEinmeldenResponse']/*[local-name()='return']/*[local-name()='commonData']/*[local-name()='patientin']/*[local-name()='vsnr']
