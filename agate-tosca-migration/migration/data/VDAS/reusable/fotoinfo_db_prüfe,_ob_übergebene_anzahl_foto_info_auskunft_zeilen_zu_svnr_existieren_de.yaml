name: fotoinfo_db_prüfe,_ob_übergebene_anzahl_foto_info_auskunft_zeilen_zu_svnr_existieren_de
steps:


      # Execute SQL Query
      - type: SQL
        op: EXEC
        command: "select FK_SV_NUMMER, FOTO_INFO_AUSKUNFT.LOESCH_KZ from FOTO_INFO_AUSKUNFT INNER JOIN FOTO_INFO ON FK_FOTO_INFO_ID=FOTO_INFO.ID where FK_SV_Nummer='{R[SVNR]}' and FOTO_INFO_AUSKUNFT.LOESCH_KZ='0'"
        response: prüfe,_ob_übergebene_anzahl_foto_info_auskunft_zeilen_zu_svnr_existieren_res

