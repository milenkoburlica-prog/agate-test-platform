testCases:

  - id: "{XL[testcaseName]}"
    description: "{XL[testcaseDescription]}"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "{XL[apiEndpoint]}"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__online
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: "{B[clientIp]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: "{B[statusCode]}"

      - type: REST
        op: ASSERT
        condition: "{B[statusCode]} == '200' AND {XL[assert.online]} != NULL"
        response: response_1
        source: BODY
        action: EXISTS
        path: "{XL[assert.online]}"

      - type: REST
        op: ASSERT
        condition: "{B[statusCode]} == '200' AND {XL[assert.pingLog]} != NULL"
        response: response_1
        source: BODY
        action: EXISTS
        path: "{XL[assert.pingLog]}"
