testCases:

  - id: Verify_getGinoInfo_success_returns_200_returns_200
    description: "Verify successful operation for a valid clientIp and serialNumber with infoType 'config'"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__ginos__serialNumber__infos__infoType_
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
          infoType: config
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

  - id: Verify_getGinoInfo_invalid_input_returns_400_returns_400
    description: "Verify HTTP 400 Bad Request for an invalid clientIp format"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__ginos__serialNumber__infos__infoType_
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
          infoType: config
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 400

  - id: Verify_getGinoInfo_scenario_returns_404_returns_404
    description: "Verify HTTP 404 Not Found for a clientIp that does not exist"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__ginos__serialNumber__infos__infoType_
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
          infoType: config
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 404
