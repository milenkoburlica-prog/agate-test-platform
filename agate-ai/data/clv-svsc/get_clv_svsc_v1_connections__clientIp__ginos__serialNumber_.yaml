testCases:

  - id: Verify_getGino_success_returns_200_returns_200
    description: "Verify that the GET request to /clv-svsc/v1/connections/{clientIp}/ginos/{serialNumber} returns a successful response with valid clientIp and serialNumber."
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__ginos__serialNumber_
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

  - id: Verify_getGino_invalid_input_returns_400_returns_400
    description: "Verify that the GET request to /clv-svsc/v1/connections/{clientIp}/ginos/{serialNumber} returns a 400 Bad Request response with an invalid clientIp."
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__ginos__serialNumber_
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 400

