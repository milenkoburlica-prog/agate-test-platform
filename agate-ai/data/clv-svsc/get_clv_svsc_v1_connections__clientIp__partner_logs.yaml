testCases:

  - id: Verify_getPartnerLogs_success_returns_200_returns_200
    description: "Verify that the GET /clv-svsc/v1/connections/{clientIp}/partner-logs returns a 200 OK for a valid clientIp."
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections__clientIp__partner_logs
        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

  - id: Verify_getPartnerLogs_invalid_input_returns_400_returns_400
