        endpoint: "{B[apiEndpoint]}"
        parameters:
          clientIp: 111.111.111.111
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: BODY
        action: EXISTS
        path: earliest

      - type: REST
        op: ASSERT
        response: response_1
        source: BODY
        action: EXISTS
        path: latest

