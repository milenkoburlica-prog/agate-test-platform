testCases:

  - id: Verify_ordinationUpdate_success_returns_200_returns_200
    description: "Verify successful operation with valid updated-after parameter"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_updates_ordinations
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

  - id: Verify_ordinationUpdate_invalid_input_returns_400_returns_400
    description: "Verify bad request response for invalid date format in updated-after parameter"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_updates_ordinations
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 400

  - id: Verify_ordinationUpdate_missing_parameter_returns_400_returns_400
    description: "Verify bad request response when the updated-after parameter is missing"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_updates_ordinations
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 400

  - id: Verify_Response_Fields_ordinationUpdate
    description: "Verify response contains documented response fields"
    stage: "*"
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:
      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_updates_ordinations
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: BODY
        action: EXISTS
        path: [*].contractPartnerNumber

      - type: REST
        op: ASSERT
        response: response_1
        source: BODY
        action: EXISTS
        path: [*].lastChange
