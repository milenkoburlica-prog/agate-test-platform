testCases:

  - id: Verify_getGino_success_returns_200_returns_200
    description: Verify that the GET request to retrieve a gino for a valid clientIp and serialNumber returns HTTP 200 OK.
    stage: '*'
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:

      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_v1_connections_clientIp_ginos_serialNumber
        endpoint: "{B[apiEndpoint]}"

        parameters:
          clientIp: 111.111.111.111
          serialNumber: 1234567890
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

