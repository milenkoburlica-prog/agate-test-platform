testCases:

  - id: Verify_get_clv_svsc_alive_success_returns_200_returns_200
    description: Verify that service alive endpoint is available
    stage: '*'
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-syst-syst.ecs.ocp-stag.cloud.svc.co.at"

    steps:

      - type: REST
        op: EXEC
        command: rest.get_clv_svsc_alive
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200
