testCases:

  - id: Verify_get_groups_success_returns_200_returns_200
    description: Verify successful operation of retrieving available card reader groups.
    stage: '*'
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-int-kvw.ecs.ocp-stag.cloud.svc.co.at"

    steps:

      - type: REST
        op: EXEC
        command: rest.get_groups
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 200

  - id: Verify_get_groups_scenario_returns_500_returns_500
    description: Verify error when business condition is not met.
    stage: '*'
    priority: HIGH

    variables:
      apiEndpoint: "https://ecs-webapps-ecs-int-kvw.ecs.ocp-stag.cloud.svc.co.at"

    steps:

      - type: REST
        op: EXEC
        command: rest.get_groups
        endpoint: "{B[apiEndpoint]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: 500
