paths:
  /clv-svsc/alive:
    $ref: "./common-openapi-files/svc-alive-v1.yaml#/paths/~1alive"
  /clv-svsc/v1/alive:
    $ref: "./common-openapi-files/svc-alive-v1.yaml#/paths/~1alive"
  /clv-svsc/v1/connections/{clientIp}/ginos:
    get:
      summary: Get all ginos for a given connection
      description: |
        ## Get all ginos for a given connection 

        This operation lists all ginos for a given connection. 

        ### Validations
        * The `clientIp` parameter must be a valid IP-address
        * The `serialNumber` parameter must be a valid 10-digit number 

        ### Returns
        * **200 OK** - The request was successful:
          * The response body contains a list of ginos.
        * **400 Bad Request** - If the request contains invalid data.
        * **404 Not Found** - The client ip was not found. 

        ### Notes
        * It is possible that the gino list is empty, if no gino is connected on the connection.
      operationId: listGinos
      tags:
        - V1 Ginos Resource
      parameters:
        - $ref: "#/components/parameters/ClientIp"
        - $ref: "#/components/parameters/SerialNumberQuery"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GinoDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorClientIp:
                  $ref: "#/components/examples/ValidationErrorClientIp"
                ValidationErrorSerialNumber:
                  $ref: "#/components/examples/ValidationErrorSerialNumber"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/InputValidationProblem"
        "404":
          description: Resource Not Found
          content:
            application/problem+json:
              examples:
                ClientIpNotFound:
                  $ref: "#/components/examples/ClientIpNotFound"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/ResourceNotFoundProblem"
  /clv-svsc/v1/connections/{clientIp}/ginos/{serialNumber}:
    get:
      summary: Get gino for a given connection and serial number
      description: |
        ## Get a ginos for a given connection and serial number 

        This operation gets a gino for a given connection and serial number. 

        ### Validations
        * The `clientIp` parameter must be a valid IP-address
        * The `serialNumber` parameter must be a valid 10-digit number 

        ### Returns
        * **200 OK** - The request was successful:
          * The response body contains a gino.
        * **400 Bad Request** - If the request contains invalid data.
        * **404 Not Found** - The client ip or serial number was not found.
      operationId: getGino
      tags:
        - V1 Ginos Resource
      parameters:
        - $ref: "#/components/parameters/ClientIp"
        - $ref: "#/components/parameters/SerialNumber"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GinoDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorClientIp:
                  $ref: "#/components/examples/ValidationErrorClientIp"
                ValidationErrorSerialNumber:
                  $ref: "#/components/examples/ValidationErrorSerialNumber"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/InputValidationProblem"
        "404":
          description: Resource Not Found
          content:
            application/problem+json:
              examples:
                ClientIpNotFound:
                  $ref: "#/components/examples/ClientIpNotFound"
                SerialNumberNotFound:
                  $ref: "#/components/examples/SerialNumberNotFound"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/ResourceNotFoundProblem"
  /clv-svsc/v1/connections/{clientIp}/ginos/{serialNumber}/infos/{infoType}:
    get:
      summary: Get info for a given gino
      description: |
        ## Get info for a given gino. 

        This operation gets the info for a given gino. 

        ### Validations
        * The `clientIp` parameter must be a valid IP-address
        * The `serialNumber` parameter must be a valid 10-digit number
        * The `infoType` parameter must be in {config, boot, statistic} 

        ### Returns
        * **200 OK** - The request was successful:
          * The response body contains the info for a gino.
        * **400 Bad Request** - If the request contains invalid data.
        * **404 Not Found** - The client ip or serial number was not found. 

        ### Notes
        * The information is a key-value pair and can be one of the following:
        * config
          * kalveAuthUrl
          * kalveDownloadUrl
          * kalveFwUrl
          * kalveNoAuthUrl
          * ipType
        * boot
          * lastBoot
        * statistic
          * adpuBasisLifetime
          * adpuBasisToday
          * adpuBasisYesterday
          * adpuNfcLifetime
          * adpuNfcToday
          * adpuNfcYesterday
          * adpuSatelliteLifetime
          * adpuSatelliteToday
          * adpuSatelliteYesterday
      operationId: getGinoInfo
      tags:
        - V1 Ginos Resource
      parameters:
        - $ref: "#/components/parameters/ClientIp"
        - $ref: "#/components/parameters/SerialNumber"
        - $ref: "#/components/parameters/InfoType"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorClientIp:
                  $ref: "#/components/examples/ValidationErrorClientIp"
                ValidationErrorSerialNumber:
                  $ref: "#/components/examples/ValidationErrorSerialNumber"
                ValidationErrorInfoType:
                  $ref: "#/components/examples/ValidationErrorInfoType"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/InputValidationProblem"
        "404":
          description: Resource Not Found
          content:
            application/problem+json:
              examples:
                ClientIpNotFound:
                  $ref: "#/components/examples/ClientIpNotFound"
                SerialNumberNotFound:
                  $ref: "#/components/examples/SerialNumberNotFound"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/ResourceNotFoundProblem"
  /clv-svsc/v1/connections/{clientIp}/online:
    get:
      summary: Check if a router is online
      description: |
        ## Check if a router is online. 

        This operation checks if a router is online. 

        ### Validations
        * The `clientIp` parameter must be a valid IP-address
        ### Returns
        * **200 OK** - The request was successful:
          * The response body contains the online status.
        * **400 Bad Request** - If the request contains invalid data.
        * **404 Not Found** - The client ip was not found. 

        ### Notes
        * The online status is a boolean value.
        * The online status is determined with a ping request to the router.
        * The ping log is the return value from the command.
      operationId: checkOnline
      tags:
        - V1 Online Resource
      parameters:
        - $ref: "#/components/parameters/ClientIp"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorClientIp:
