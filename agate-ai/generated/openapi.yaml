openapi: 3.0.4
info:
  title: CLV SVSC
  version: v1
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: A service for retrieving the ordinations from our contract partners and analyzing the data for our client devices (GINOs).
  contact:
    name: Jakob Graf
    email: jakob.graf@svc.co.at
tags:
  - name: V1 Ordinations Resource
  - name: V1 Updates Resource
  - name: V1 Ginos Resource
  - name: V1 Online Resource
  - name: V1 Partner Logs Resource
components:
  parameters:
    SerialNumberQuery:
      name: serialNumber
      in: query
      schema:
        description: The serial number of the gino.
        pattern: "^[\\d\\*]*$"
        type: string
        example: "1234567890"
    ClientIp:
      name: clientIp
      in: path
      required: true
      schema:
        description: The IP address of the connection.
        pattern: "^((25[0-5]|(2[0-4]|1\\d|[1-9]|)\\d)\\.?\\b){4}$"
        type: string
        example: 111.111.111.111
    SerialNumber:
      name: serialNumber
      in: path
      required: true
      schema:
        description: The serial number of the gino.
        pattern: "^\\d{10}$"
        type: string
        example: "1234567890"
    InfoType:
      name: infoType
      in: path
      required: true
      schema:
        description: The info type to get infos for the gino.
        pattern: ^config|boot|statistic$
        type: string
        example: config
    Timeout:
      name: timeout
      in: query
      schema:
        format: int64
        description: Timeout for request to backend service in milliseconds.
        default: "2000"
        maximum: 10000
        minimum: 1
        type: integer
        example: 2000
    ContractPartnerNumber:
      name: contractPartnerNumber
      in: path
      required: true
      schema:
        description: The contract partner number to deliver ordinations for.
        pattern: "^.{6}$"
        type: string
        example: "123456"
    UpdatedAfter:
      name: updated-after
      in: query
      schema:
        description: Only retrieve relevant ordinations which are updated after the given date.
        type: string
  responses: {}
  schemas:
    ZonedDateTime:
      format: date-time
      type: string
      example: 2022-03-10T12:15:50+02:00
    GinoDto:
      type: object
      properties:
        ginoIp:
          description: The IP address of the Gino device
          type: string
          example: 127.0.0.1
        name:
          description: The name of the Gino device
          type: string
          example: Gino Entrance
        group:
          description: The group of the Gino device
          type: string
          example: Ordination
        serialNumber:
          description: The serial number of the Gino device
          type: string
          example: "1234567890"
        status:
          description: The status of the Gino device
          type: string
          allOf:
            - $ref: "#/components/schemas/GinoStatus"
          example: ACTIVE
        creationDate:
          description: The creation date of the Gino device
          type: string
          allOf:
            - $ref: "#/components/schemas/LocalDateTime"
          example: 2021-01-01T00:00:00
        lastContact:
          description: The last contact date of the Gino device
          type: string
          allOf:
            - $ref: "#/components/schemas/LocalDateTime"
          example: 2021-01-01T00:00:00
        fwVersion:
          description: The firmware version of the Gino device
          type: string
          example: 1.0.0
        macAddress:
          description: The MAC address of the Gino device
          type: string
          example: 00:00:00:00:00:00
        satelliteSerialNumber:
          description: The serial number of the satellite connected to the Gino device. Returns null when no satellite is attached.
          type: string
          example: "1234567890"
        accessDns:
          description: The dns of the Gino device
          type: string
          example: gino.local
    GinoStatus:
      type: string
      description: |
        Status of the GINO device.
        
        The statuses `ACTIVE` and `INACTIVE` imply that the GINO has been released (i.e. it is not `NOT_RELEASED`).
        The distinction between `ACTIVE` and `INACTIVE` is based solely on the timestamp of the last contact.
        
        * NOT_RELEASED - The GINO is registered in the system but has not yet been released for productive use.
        * ACTIVE - The GINO is released and its last contact was within the last 31 minutes.
        * INACTIVE - The GINO is released and its last contact was more than 31 minutes ago.
      enum:
        - NOT_RELEASED
        - ACTIVE
        - INACTIVE
    LocalDateTime:
      format: date-time
      type: string
    OnlineDto:
      type: object
      properties:
        online:
          description: The online status of the Gino device
          type: boolean
          example: true
        pingLog:
          description: The ping log of the Gino device
          type: array
          items:
            type: string
    UpdateOrdinationTuple:
      required:
        - contractPartnerNumber
        - lastChange
      type: object
      properties:
        contractPartnerNumber:
          description: The contract partner number.
          pattern: "^.{0,6}$"
          type: string
          example: "222222"
        lastChange:
          description: The last change of any relevant ordination of the contract partner.
          type: string
          allOf:
            - $ref: "#/components/schemas/ZonedDateTime"
          example: 2025-01-01T00:00:00+02:00
    AncestorDto:
      type: object
      properties:
        contractPartnerNumber:
          description: The contract partner number.
          pattern: "^[0-9]$"
          type: string
          example: "999002"
        ordinationNumber:
          description: The ordination number.
          pattern: "[0-9]{1,2}"
          type: integer
          example: 99
    ProvisionDto:
      type: object
      properties:
        provider:
          description: The name of the provider.
          type: string
          example: SVC
        redundancy:
          description: If the connection is redundant.
          type: boolean
          example: true
        connectionNumber:
          description: The connection number.
          type: string
          example: "123456789"
        creationDate:
          description: The creation date of the connection.
          type: string
          allOf:
            - $ref: "#/components/schemas/ZonedDateTime"
          example: 2025-11-11T11:11:11+02:00
    OrdinationDto:
      required:
        - contractPartnerNumber
        - ordinationNumber
        - lastName
      type: object
      properties:
        contractPartnerNumber:
          description: The contract partner number.
          pattern: "^[0-9]$"
          type: string
          example: "999000"
        ordinationNumber:
          description: The ordination number.
          pattern: "[0-9]{1,2}"
          type: integer
          example: 99
        ordinationActive:
          description: The ordination active flag.
          type: boolean
          example: true
        formOfAddress:
          description: The form of address.
          type: string
          example: Frau
        titlePrefix:
          description: The title prefix.
          type: string
          example: Dr.
        firstName:
          description: The first name.
          type: string
          example: Michaela
        lastName:
          description: The last name.
          type: string
          example: Musterfrau
        titleSuffix:
          description: The title suffix.
          type: string
          example: MSc.
        zip:
          description: The zip code.
          type: string
          example: "1010"
        city:
          description: The city.
          type: string
          example: Wien
        street:
          description: The street.
          type: string
          example: Stephansplatz 1
        predecessor:
          description: The predecessor ordination.
          type: object
          allOf:
            - $ref: "#/components/schemas/AncestorDto"
        successor:
          description: The successor ordination.
          type: object
          allOf:
            - $ref: "#/components/schemas/AncestorDto"
        clientIp:
          description: The client IP address.
          type: string
          example: 111.111.111.111
        provision:
          description: The provision of this connection
          type: object
          allOf:
            - $ref: "#/components/schemas/ProvisionDto"
        reservation:
          description: The reservation of this connection
          type: object
          allOf:
            - $ref: "#/components/schemas/ProvisionDto"
    PartnerLogsDto:
      type: object
      properties:
        earliest:
          description: The earliest date of the logs
          type: string
          allOf:
            - $ref: "#/components/schemas/LocalDateTime"
          example: 2021-01-01T00:00:00
        latest:
          description: The latest date of the logs
          type: string
          allOf:
            - $ref: "#/components/schemas/LocalDateTime"
          example: 2021-01-01T00:00:00
        entries:
          description: The entries of the logs
          type: array
          items:
            type: string
          example:
            - 2021-01-01T00:00:00 - INFO - Log message
  examples:
    ClientIpNotFound:
      summary: Resource Not Found (Client Ip)
      description: No connection with this ip is found.
      value:
        type: urn:problem-type:belgif:resourceNotFound
        href: https://www.belgif.be/specification/rest/api-guide/problems/resourceNotFound.html
        title: Resource Not Found
        status: 404
        detail: No data found for /connection/111.111.111.1 with clientIp [111.111.111.1]
        issues:
          - in: path
            name: clientIp
            value: 111.111.111.1
        instance: /clv-svsc/v1/connnection/111.111.111.1/gino/123456
        transactionId: 1d7a42d1-d7c4-4a09-80cb-a812f66e538c
    SerialNumberNotFound:
      summary: Resource Not Found (Serial Number)
      description: No gino found with this serial number.
      value:
        type: urn:problem-type:belgif:resourceNotFound
        href: https://www.belgif.be/specification/rest/api-guide/problems/resourceNotFound.html
        title: Resource Not Found
        status: 404
        detail: No data found for /connection/111.111.111.1/gino/123456 with serialNumber [123456]
        issues:
          - in: path
            name: serialNumber
            value: "123456"
        instance: /clv-svsc/v1/connnection/111.111.111.1/gino/123456
        transactionId: 1d7a42d1-d7c4-4a09-80cb-a812f66e538c
    ContractPartnerNumberNotFound:
      summary: Resource Not Found (Contract Partner Number)
      description: If you receive this error, the contract partner does not exist.
      value:
        type: urn:problem-type:belgif:resourceNotFound
        href: https://www.belgif.be/specification/rest/api-guide/problems/resourceNotFound.html
        title: Resource Not Found
        status: 404
        detail: No data found for /contract-partners/123457 with contractPartnerNumber [123457]
        issues:
          - in: path
