  /clv-svsc/v1/contract-partners/{contractPartnerNumber}/ordinations:
    get:
      summary: List Ordinations of Contract Partner
      description: |
        ## List Ordinations of Contract Partner 
        
        This operation retrieves all ordinations associated with a given contract partner number. 
        
        ### Validations
        * The contract partner number must be a **max. 6-character string** 
        
        ### Returns
        * **200 OK** - If the contract partner number exists:
          * The response body contains a list of all ordinations for the contract partner.
        * **400 Bad Request** - If the request contains invalid data.
        * **404 Not Found** - If the contract partner number does not exist. 
        
        ### Notes
        * Normally, there is exactly **one ordination** per contract partner.
        * The fields:
          * `successor.*` are included **only if** there is a **successor** ordination.
          * `predecessor.*` are included **only if** there is a **predecessor** ordination.
        * The field:
          * `clientIp` is included **only if** there is a **connection** assigned to the ordination.
          * `provision` is returned **only if** the ordination is **provisioned**.
          * `reservation` is returned **only if** the ordination has a **reservation**.
        * Fields are **only returned** if their values are **set** (i.e., not `null`).
      operationId: listOrdinations
      tags:
        - V1 Ordinations Resource
      parameters:
        - $ref: "#/components/parameters/ContractPartnerNumber"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                listOrdinationsDefault:
                  summary: Not provisioned
                  description: |
                    In this scenario, we observe an **ordination** that is not provisioned.
                    We can determine this based on the following conditions: 

                    1. No detailed information about the provision is delivered.
                       The following fields are `null`:
                       - `provision` 

                    2. The field `clientIp` is set, if one is already registered for the ordination.
                  value:
                    - contractPartnerNumber: "999000"
                      ordinationNumber: 99
                      ordinationActive: true
                      formOfAddress: Frau
                      titlePrefix: Dr.
                      firstName: Manuela
                      lastName: Musterfrau
                      titleSuffix: MSc.
                      zip: "1010"
                      city: Wien
                      street: Stephansplatz 1
                      clientIp: 111.111.111.111
                listOrdinationsProvisioned:
                  summary: Provisioned
                  description: |
                    In this scenario, we observe an **ordination** that is provisioned.
                    We can determine this based on the following conditions: 

                    1. Detailed information about the provision is delivered.
                       The following fields are set:
                       - `provision` 

                    2. The field `clientIp` is set.
                  value:
                    - contractPartnerNumber: "999000"
                      ordinationNumber: 99
                      ordinationActive: true
                      formOfAddress: Frau
                      titlePrefix: Dr.
                      firstName: Manuela
                      lastName: Musterfrau
                      titleSuffix: MSc.
                      zip: "1010"
                      city: Wien
                      street: Stephansplatz 1
                      clientIp: 111.111.111.111
                      provision:
                        provider: SVC
                        redundancy: true
                        connectionNumber: "123456789"
                        creationDate: 2025-11-11T11:11:11
                listOrdinationsReserved:
                  summary: Reserved
                  description: |
                    In this scenario, we observe an **ordination** that is provisioned.
                    We can determine this based on the following conditions: 

                    1. Detailed information about the provision is delivered.
                       The following fields are set:
                       - `provision` 

                    2. The field `clientIp` is set.
                  value:
                    - contractPartnerNumber: "999000"
                      ordinationNumber: 99
                      ordinationActive: true
                      formOfAddress: Frau
                      titlePrefix: Dr.
                      firstName: Manuela
                      lastName: Musterfrau
                      titleSuffix: MSc.
                      zip: "1010"
                      city: Wien
                      street: Stephansplatz 1
                      clientIp: 111.111.111.111
                      provision:
                        provider: SVC
                        redundancy: true
                        connectionNumber: "123456789"
                        creationDate: 2025-11-11T11:11:11
                      reservation:
                        provider: A1
                        redundancy: false
                        connectionNumber: ABC-123
                        creationDate: 2026-11-11T11:11:11
                listOrdinationsAncestors:
                  summary: Ancestors
                  description: |
                    In this scenario, we observe an **ordination** that has been **moved**.
                    We can determine this based on the following conditions: 

                    1. The fields `successor` and `predecessor` are set.
                       The following fields are set on the new ordination:
                       - `predecessor`
                       The following fields are set on the old ordination:
                       - `successor` 

                    2. The field `clientIp` and `provision` is set on the new ordination.
                    3. There are some combinations of `predecessor` and `successor` which describes different scenarios
                       - `successor` and `clientIp` is set (Ordination is ready to be moved to `successor`).
                       - `predecessor` and `clientIp` is set (Ordination was moved from `predecessor`).
                       - `successor` is set with different `contractPartnerNumber` (`successor` took over the ordination)
                       - `predecessor` is set with different `contractPartnerNumber` (Ordination was taken over from `predecessor`)
                  value: |
                    [
                        {
                            "contractPartnerNumber": "999000",
                            "ordinationNumber": 99,
                            "ordinationActive": true,
                            "formOfAddress": "Frau",
                            "titlePrefix": "Dr.",
                            "firstName": "Manuela",
                            "lastName": "Musterfrau",
                            "titleSuffix": "MSc.",
                            "zip": "1010",
                            "city": "Wien",
                            "street": "Stephansplatz 2",
                            "predecessor": {
                                "contractPartnerNumber": "999000",
                                "ordinationNumber": 99
                            },
                            "clientIp": "111.111.111.111",
                            "provision": {
                                "provider": "SVC",
                                "redundancy": true,
                                "connectionNumber": "123456789",
                                "creationDate": "2025-11-11T11:11:11"
                            },
                            "reservation": {
                                "provider": "A1",
                                "redundancy": false,
                                "connectionNumber": "ABC-123",
                                "creationDate": "2026-11-11T11:11:11"
                            }
                        },
                        {
                            "contractPartnerNumber": "999000",
                            "ordinationNumber": 99,
                            "ordinationActive": false,
                            "formOfAddress": "Frau",
                            "titlePrefix": "Dr.",
                            "firstName": "Manuela",
                            "lastName": "Musterfrau",
                            "titleSuffix": "MSc.",
                            "zip": "1010",
                            "city": "Wien",
                            "street": "Stephansplatz 1",
                            "successor": {
                                "contractPartnerNumber": "999000",
                                "ordinationNumber": 99
                            }
                        }
                    ]
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrdinationDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorContractPartnerNumber:
                  $ref: "#/components/examples/ValidationErrorContractPartnerNumber"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/InputValidationProblem"
        "404":
          description: Resource Not Found
          content:
            application/problem+json:
              examples:
                ContractPartnerNumberNotFound:
                  $ref: "#/components/examples/ContractPartnerNumberNotFound"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/ResourceNotFoundProblem"
  /clv-svsc/v1/updates/ordinations:
    get:
      summary: Get Contract Partners with Updated Relevant Ordinations
      description: |
        ## Get Contract Partners with Updated Relevant Ordinations 
        
        This operation retrieves all contract partners for whom a relevant ordination has been updated after the specified date. 
        
        ### Validations
        * The `updated-after` parameter must be a valid ISO-8601 date-time string **with timezone offset**, e.g.: `2025-01-01T01:00:00+02:00` 
        
        ### Returns
        * **200 OK** - The request was successful:
          * The response body contains a list of contract partner numbers, each with the latest relevant change timestamp.
        * **400 Bad Request** - If the request contains invalid data. 
        
        ### Notes
        * It is possible that a contract partner number is returned **even though no relevant change occurred**.
          * For example: A non-relevant field was changed on the server.
        * All **ordinations** are considered relevant.
        * Only ordinations that have changed **after** the `updated-after` date are considered.
        * Newly inserted ordinations or provisions are relevant, as well as changes for the ordination or provision.
        * If the `updated-after` parameter is **not provided**, a default value is used:
          * **Yesterday at 00:00 (server time)**.
      operationId: ordinationUpdate
      tags:
        - V1 Updates Resource
      parameters:
        - $ref: "#/components/parameters/UpdatedAfter"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvSystem"
        - $ref: "./common-openapi-files/common-v1.yaml#/components/parameters/StdHeaderSvTxId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                updatedOrdinationsDefault:
                  summary: Updated Ordinations Default
                  description: |
                    In this scenario, we observe one possibly updated **ordination** for the contract partner.
                    We can determine this based on the following conditions: 

                    1. An entry for the contract partner is included in the list.
                  value: |
                    [
                        {
                            "contractPartnerNumber": "999000",
                            "lastChange": "2025-11-11T11:11:11+02:00",
                        }
                    ]
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpdateOrdinationTuple"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              examples:
                ValidationErrorUpdatedAfter:
                  $ref: "#/components/examples/ValidationErrorUpdatedAfter"
              schema:
                $ref: "./common-openapi-files/problem-v1.yaml#/components/schemas/InputValidationProblem"
