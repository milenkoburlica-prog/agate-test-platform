# Open shadow roots support CSS locators. HTML dialogs are DOM elements; JS alerts use the server default dismiss handler.
steps:
# Next step: one locator strategy; assertions wait for the requested state.
- type: GUI
  op: EXEC
  action: OPEN
  url: http://127.0.0.1:8767/12-advanced.html
  page: L12 — Shadow DOM, editable content and dialogs
# Next step: one locator strategy; assertions wait for the requested state.
- type: GUI
  op: EXEC
  action: CLICK
  target:
    css: '#L12-shadow-button'
  page: L12 — Shadow DOM, editable content and dialogs
# Next step: one locator strategy; assertions wait for the requested state.
- type: GUI
  op: ASSERT
  action: TEXT
  target:
    css: '#L12-shadow-result'
