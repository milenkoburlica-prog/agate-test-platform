# Lokaler Web Chat und REST API
quarkus.http.host=127.0.0.1
quarkus.http.port=8091
quarkus.http.test-port=8092
agate.agent.max-attempts=3
agate.agent.max-chars=5242880
# Maximaler lokaler JSON-Upload inkl. Overhead
quarkus.http.limits.max-body-size=6M

# Groq (nur dieser LLM-Adapter ist aktuell aktiv)
agate.groq.url=https://api.groq.com/openai/v1/chat/completions
agate.groq.model=openai/gpt-oss-120b
agate.groq.timeout-seconds=90
# Optionaler Pfad auf eine externe Textdatei mit genau einem API-Key:
# agate.groq.api-key-file=C:/work/projects/agate-studio-new/secrets/groq-api-key.txt
# Alternative: GROQ_API_KEY_FILE oder GROQ_API_KEY als Umgebungsvariable
