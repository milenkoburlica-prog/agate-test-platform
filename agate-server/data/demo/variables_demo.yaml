  # Test Suite: TOSCA Date Compatibility & Defaults
  - id: TC Tosca Date Defaults
    description: Verifizierung der Default-Formate und Offset-Logik
    stage: "*"
    priority: HIGH  
    steps:
      # 1. Defaults ohne Parameter
      - type: CMD
        op: EXEC
        command: 'echo Default DATE: {DATE}' # Erwartet: dd.MM.yyyy
        response: buff_out

      - type: CMD
        op: EXEC
        command: 'echo Default DATETIME: {DATETIME}' # Erwartet: dd.MM.yyyy hh:mm:ss
        response: buff_out

      # 2. Leere Klammern & Formate
      - type: CMD
        op: EXEC
        command: 'echo DATE[][][]: {DATE[][][]}' # Default Format dd.MM.yyyy
        response: buff_out

      - type: CMD
        op: EXEC
        command: 'echo DATE ddMMyyyy: {DATE[][][ddMMyyyy]}'
        response: buff_out

      - type: CMD
        op: EXEC
        command: 'echo DATE yyyy: {DATE[][][yyyy]}'
        response: buff_out

      # 3. Offsets mit Default-Format
      - type: CMD
        op: EXEC
        command: 'echo Offset +10 Tage: {DATE[][+10d][]}'
        response: buff_out

      - type: CMD
        op: EXEC
        command: 'echo Offset +6M +1d: {DATE[][+6M+1d][]}'
        response: buff_out

      # 4. Offsets mit non-Default-Format
      - type: CMD
        op: EXEC
        command: 'echo Offset +10 Tage: {DATE[][+10d][]}'
        response: buff_out

      - type: CMD
        op: EXEC
        command: 'echo Offset +2d for 22.01.2025: {DATE[22.01.2025][2d][]}'
        response: buff_out

      # 5. Komplexe DATETIME
      - type: CMD
        op: EXEC
        command: 'echo DATETIME -200d: {DATETIME[][-200d][dd-MM-yyyy HH:mm:ss]}'
        response: buff_out

