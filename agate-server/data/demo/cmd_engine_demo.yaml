# CMD Engine Demo
testCases:
  - id: TC_CMD_Engine_Demo
    description: CMD Engine Demo
    stage: "*"
    priority: HIGH

    variables:
      command: "ver"

    steps:

      # 1. EXEC with default exit-code validation
      - type: CMD
        op: EXEC
        command: "echo %OS%"
        response: os_version

      # 2. Store complete output
      - type: CMD
        op: BUFFER
        response: os_version
        action: TEXT
        name: os_version_var

      # 3. Conditional execution
      - type: CMD
        condition: "'{B[os_version_var]}' == 'Windows_NT'"
        op: EXEC
        command: "{B[command]}"
        response: windows_version

      # 4. EXEC Java version
      - type: CMD
        op: EXEC
        command: "java --version"
        response: java_version_raw

      # 5. BUFFER TEXT
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: TEXT
        name: java_version

      # 6. BUFFER FILTER
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: FILTER
        value: "Runtime"
        name: java_runtime_version

      # 7. BUFFER LINE with default value 0
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LINE
        name: java_version

      # 8. BUFFER LINE 0
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LINE
        value: 0
        name: java_version

      # 9. BUFFER LINE 1
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LINE
        value: 1
        name: java_version

      # 10. BUFFER LAST_LINE with default value 0
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LAST_LINE
        name: java_version

      # 11. BUFFER LAST_LINE 0
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LAST_LINE
        value: 0
        name: java_version_last_line

      # 12. BUFFER LAST_LINE 1
      - type: CMD
        op: BUFFER
        response: java_version_raw
        action: LAST_LINE
        value: 1
        name: java_version

      # 13. ASSERT EXITCODE
      - type: CMD
        op: ASSERT
        response: java_version_raw
        action: EXITCODE
        expected: 0

      # 14. ASSERT CONTAINS
      - type: CMD
        op: ASSERT
        response: java_version_raw
        action: CONTAINS
        value: "OpenJDK 64-Bit"

      # 15. ASSERT NOT_CONTAINS
      - type: CMD
        op: ASSERT
        response: java_version_raw
        action: NOT_CONTAINS
        value: "OpenJDK 32-Bit"

      # 16. ASSERT COUNT
      - type: CMD
        op: ASSERT
        response: java_version_raw
        action: COUNT
        value: "OpenJDK 64-Bit"
        expected: 1

      # 17. ASSERT buffered string
      - type: CMD
        op: ASSERT
        response: java_version_last_line
        action: CONTAINS
        value: "OpenJDK 64-Bit"

      # 18. ASSERT buffered string
      - type: CMD
        op: ASSERT
        response: java_version_last_line
        action: CONTAINS
        value: "OpenJDK 64-Bit Server VM"

      # 19. ASSERT buffered string
      - type: CMD
        op: ASSERT
        response: java_version_last_line
        action: NOT_CONTAINS
        value: "OpenJDK 32-Bit Server VM Temurin-21.0.10+7 (build 21.0.10+7-LTS, mixed mode, sharing)"

      # 20. Explicit expectedExitCode = 0
      - type: CMD
        op: EXEC
        command: "echo expected exit code zero"
        response: expected_exit_0
        expectedExitCode: 0

      # 21. Explicit non-zero expectedExitCode
      - type: CMD
        op: EXEC
        command: "exit /b 7"
        response: expected_exit_7
        expectedExitCode: 7

      # 22. Verify non-zero exit code
      - type: CMD
        op: ASSERT
        response: expected_exit_7
        action: EXITCODE
        expected: 7

      # 23. Disable automatic exit-code validation
      - type: CMD
        op: EXEC
        command: "exit /b 5"
        response: unchecked_exit_5
        checkExitCode: false

      # 24. Verify exit code manually
      - type: CMD
        op: ASSERT
        response: unchecked_exit_5
        action: EXITCODE
        expected: 5

      # 25. Explicit timeout
      - type: CMD
        op: EXEC
        command: "echo timeout test"
        response: timeout_test
        timeout: 5

      # 26. Verify timeout test output
      - type: CMD
        op: ASSERT
        response: timeout_test
        action: CONTAINS
        value: "timeout test"

      # 27. Write command output to local file
      - type: CMD
        op: EXEC
        command: "echo AGATE CMD outputFile test"
        response: output_file_test
        outputFile: "output/cmd-output.txt"

      # 28. Verify outputFile exists
      - type: CMD
        op: EXEC
        command: 'if exist "output\cmd-output.txt" (exit /b 0) else (exit /b 1)'
        response: output_file_exists
        expectedExitCode: 0

      # 29. Read outputFile using CMD
      - type: CMD
        op: EXEC
        command: 'type "output\cmd-output.txt"'
        response: output_file_content

      # 30. Verify outputFile content
      - type: CMD
        op: ASSERT
        response: output_file_content
        action: CONTAINS
        value: "AGATE CMD outputFile test"

      # 31. Explicit checkExitCode true
      - type: CMD
        op: EXEC
        command: "echo explicit checkExitCode true"
        response: explicit_check_exit
        expectedExitCode: 0
        checkExitCode: true

      # 32. Verify output
      - type: CMD
        op: ASSERT
        response: explicit_check_exit
        action: CONTAINS
        value: "explicit checkExitCode true"