- id: l03-ref-027
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-email
  expected: demo@example.test

- section: Password
  description: Nur fiktive Lernwerte verwenden; Ein- und Ausgabe explizit sensibel
    markieren.

- id: l03-ref-028
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: FILL
