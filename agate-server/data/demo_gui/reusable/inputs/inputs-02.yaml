  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: PRESS
  textbox:
    id: L03-name
  value: Enter

- id: l03-ref-017
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: TEXT
  target:
    css: '#L03-enter'
  expected: Enter received

- type: WAIT
  value: '5000'

- section: EXTRACT mit source=value
  description: Den aktuellen Wert lesen, nicht ein möglicherweise veraltetes HTML-Attribut.

- id: l03-ref-018
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: EXTRACT
  textbox:
    id: L03-name
  source: value
  buffer: DemoCurrentName

- id: l03-ref-019
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-name
  expected: '{B[DemoCurrentName]}'

- section: VALUE-Muster
  description: Glob verwendet nur den Joker *; Regex braucht explizite Grenzen.

- id: l03-ref-020
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE_GLOB
  textbox:
    id: L03-name
  expected: Taylor*

- id: l03-ref-021
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE_MATCHES
  textbox:
    id: L03-name
  expected: ^Taylor Example$

- section: Feld leeren
  description: FILL mit leerem String ersetzt den Inhalt; keine eigene CLEAR-Aktion.

- id: l03-ref-022
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: FILL
  textbox:
    id: L03-name
  value: ''

- id: l03-ref-023
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-name
  expected: ''

- type: WAIT
  value: '5000'

- section: Alias INPUT
  description: INPUT wird intern zu FILL normalisiert. Neue Tests sollten FILL bevorzugen.

- id: l03-ref-024
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: INPUT
  textbox:
    id: L03-name
  value: Jordan Example

