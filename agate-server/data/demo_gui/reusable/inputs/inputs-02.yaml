    name: Full name
    exact: true

- id: l03-ref-010
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: COUNT
  textbox:
    label: Full
    exact: false
  expected: 1

- section: Zustände und Timeout
  description: Sichtbarkeit, Präsenz und aktiviert prüfen; kein EDITABLE-Assertion
    erfinden.

