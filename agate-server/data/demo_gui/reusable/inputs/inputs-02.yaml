  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-notes
  expected: 'Erste Zeile

    Zweite Zeile'

- type: WAIT
  value: '5000'

- section: Readonly
  description: Das Feld bleibt enabled, ist aber nicht editierbar. Kein FILL-Versuch.

