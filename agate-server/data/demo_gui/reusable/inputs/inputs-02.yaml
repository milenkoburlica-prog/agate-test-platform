  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: EXISTS
  textbox:
    id: L03-name

- id: l03-ref-012
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: ENABLED
  textbox:
    id: L03-name

