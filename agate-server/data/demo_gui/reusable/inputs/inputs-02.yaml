  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: WAIT
  textbox:
    id: L03-name
  state: visible
  timeout: 2500

- section: CLICK und HOVER
  description: Das Feld bedienen. Eine Tooltip-Wirkung ist auf dieser Seite nicht
    implementiert.

- id: l03-ref-014
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: CLICK
  textbox:
    id: L03-name

- id: l03-ref-015
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: HOVER
  textbox:
    id: L03-name

- section: Tastaturereignis
  description: Enter erzeugt in der Fixture einen überprüfbaren Ergebnistext.

