steps:

- section: Label auswählen
  description: Ein Feld über seine fachliche Beschriftung wählen und den Wert prüfen.

- id: l03-ref-002
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: FILL
  textbox:
    label: Full name
    exact: true
  value: Alex Example

- id: l03-ref-003
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-name
  expected: Alex Example

- type: WAIT
  value: '5000'

- section: Placeholder als Alternative
  description: Den bestehenden Namen durch eine neue Eingabe ersetzen.

- id: l03-ref-004
  type: GUI
  op: EXEC
  page: L03 - Inputs
  action: FILL
  textbox:
    placeholder: Enter full name
  value: Taylor Example

- id: l03-ref-005
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-name
  expected: Taylor Example

- type: WAIT
  value: '5000'
- section: Weitere Locator-Strategien
  description: ID, CSS, testId und Rolle als Alternativen zeigen.

- id: l03-ref-006
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VISIBLE
  textbox:
    id: L03-name

- id: l03-ref-007
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VISIBLE
  target:
    css: '#L03-name'

- id: l03-ref-008
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VISIBLE
  target:
    testId: name-input

- id: l03-ref-009
  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VISIBLE
  target:
