  type: GUI
  op: ASSERT
  page: L03 - Inputs
  action: VALUE
  textbox:
    id: L03-name
  expected: Jordan Example

- section: Email
  description: Eine Texteingabe und Wertprüfung ist noch keine vollständige Fachvalidierung.

