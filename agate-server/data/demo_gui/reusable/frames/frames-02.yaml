steps:

- section: Lernseite öffnen
  description: Jeder Test beginnt mit einer frischen Seite.

- id: frames-02-001
  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: OPEN
  url: http://127.0.0.1:8767/09-frames.html

- type: WAIT
  value: '5000'

- section: Iframe-Element im Hauptdokument
  description: Iframe-Element im Hauptdokument

- id: frames-02-002
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: VISIBLE
  target:
    css: '#L09-frame'

- section: Text im Hauptdokument
  description: Text im Hauptdokument

- id: frames-02-003
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-message'
  expected: Hauptdokument

- section: Gleiche ID im Frame separat
  description: Gleiche ID im Frame separat

- id: frames-02-004
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-message'
    frames:
    - '#L09-frame'
  expected: Frame-Dokument

- section: Iframe mit Attribut-Selektor
  description: Iframe mit Attribut-Selektor

- id: frames-02-005
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-message'
