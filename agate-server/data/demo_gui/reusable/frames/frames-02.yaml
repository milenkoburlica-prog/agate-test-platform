  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: CLICK
  target:
    role: button
    name: Frame-Aktion
    exact: true
    scope:
      css: '#L09-form'
    frames:
    - '#L09-frame'

- section: Frame-Ausgabe prüfen
  description: Frame-Ausgabe prüfen

- id: frames-02-011
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-result'
