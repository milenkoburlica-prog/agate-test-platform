      cell: 1
    frames:
    - '#L09-frame'
    - '#L09-inner'
  expected: Frame-Zelle

- section: Text aus innerem Frame extrahieren
  description: Text aus innerem Frame extrahieren

- id: frames-02-017
  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: EXTRACT
  target:
    css: '#L09-message'
    frames:
    - '#L09-frame'
    - '#L09-inner'
