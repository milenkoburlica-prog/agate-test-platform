  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: CHECK
  target:
    label: Innere Zustimmung
    frames:
    - '#L09-frame'
    - '#L09-inner'

- section: Innere Checkbox angehakt
  description: Innere Checkbox angehakt

- id: frames-02-015
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: CHECKED
  target:
    css: '#L09-check'
    frames:
    - '#L09-frame'
    - '#L09-inner'

