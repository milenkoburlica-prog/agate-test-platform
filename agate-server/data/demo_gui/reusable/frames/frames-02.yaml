  description: Frame-Inhalt ist nicht im Haupt-DOM

- id: frames-02-007
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: NOT_EXISTS
  target:
    css: '#L09-input'

- section: Input im Frame ausfüllen
  description: Input im Frame ausfüllen

- id: frames-02-008
  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: FILL
  target:
    label: Frame-Name
    exact: true
    frames:
    - '#L09-frame'
  value: Alex

