- section: Frame-Buffer prüfen
  description: Frame-Buffer prüfen

- id: frames-02-018
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-message'
    frames:
    - '#L09-frame'
    - '#L09-inner'
  expected: '{B[FrameText]}'

