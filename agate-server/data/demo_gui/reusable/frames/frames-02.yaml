  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: CLICK
  target:
    role: button
    name: Scoped action
    exact: true
    scope:
      css: '#L09-right'

- section: 'Scope-Ergebnis: Rechts'
  description: 'Scope-Ergebnis: Rechts'

- id: frames-02-024
  type: GUI
  op: ASSERT
  page: Frames - Lernreferenz 02
  action: TEXT
  target:
    css: '#L09-result'
  expected: Rechts

- section: Verschachtelter Scope im Frame
  description: Verschachtelter Scope im Frame

- id: frames-02-025
  type: GUI
  op: EXEC
  page: Frames - Lernreferenz 02
  action: EXTRACT
  target:
