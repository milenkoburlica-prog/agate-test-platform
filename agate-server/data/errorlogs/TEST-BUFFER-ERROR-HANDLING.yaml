testCases:

  - id: BUF_ERR_01_ASSERT_MISMATCH
    stage: '*'
    priority: HIGH
    steps:
      - type: BUFFER
        op: EXEC
        name: application_env
        value: Customer-Service-PROD

      - type: BUFFER
        op: ASSERT
        name: application_env
        action: EQUALS
        expected: Customer-Service-TEST

  - id: BUF_ERR_02_UNKNOWN_BUFFER
