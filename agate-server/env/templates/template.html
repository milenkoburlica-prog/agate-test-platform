<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agate Test Studio Quality Report</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --card2:#273549; --text:#f8fafc; --muted:#94a3b8; --success:#22c55e; --failed:#ef4444; --blue:#3b82f6; --border:#334155; }
        body { background:var(--bg); color:var(--text); font-family:Segoe UI,Arial,sans-serif; padding:24px; }
        .container { max-width:1400px; margin:auto; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:20px; }
        .title { font-size:30px; font-weight:700; margin-bottom:8px; }
        .subtitle { color:var(--muted); margin-bottom:25px; }
        .header-layout { display:flex; justify-content:space-between; align-items:center; gap:50px; flex-wrap:wrap; }
        /* Donut i KPI stilovi ostaju isti */
        .donut { width:220px; height:220px; border-radius:50%; position:relative; background: {{GRADIENT_STYLE}}; }
        .donut-inner { position:absolute; inset:20px; border-radius:50%; background:var(--card); display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .donut-inner h1 { font-size:54px; }
        .kpis { display:flex; gap:18px; }
        .kpi { width:180px; padding:20px; border-radius:12px; background:var(--card2); text-align:center; }
        .kpi-value { font-size:38px; font-weight:bold; }
        
        /* Novi dizajn sekcije */
        .section-title { font-size:24px; margin-bottom:20px; }
        details { margin-bottom:12px; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--card2); }
        summary { list-style:none; cursor:pointer; padding:18px; }
        summary::-webkit-details-marker { display:none; }
        .suite-row { display:flex; justify-content:space-between; align-items:center; }
.step-log {
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    font-size: 12px;
    background: #000;
    color: #00ff00;
    padding: 10px;
    border-radius: 4px;
    white-space: pre-wrap;
    margin: 5px 0;
}

.badge { 
    padding: 4px 10px; 
    border-radius: 20px; 
    background: rgba(255, 255, 255, .07); 
    font-size: 12px; 
    font-weight: 600;
}
.badge.passed { 
    background: rgba(34, 197, 94, 0.15); 
    color: #4ade80; 
}
.badge.failed { 
    background: rgba(239, 68, 68, 0.15); 
    color: #f87171; 
}
        .content { padding:20px; background:var(--card); border-top:1px solid var(--border); }
        table { width:100%; border-collapse:collapse; }
        th { text-align:left; color:var(--muted); padding:10px; border-bottom:1px solid var(--border); }
        td { padding:10px; border-bottom:1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="title">Agate Test Studio Quality Report</div>
            <div class="subtitle">Application: <b>{{RUNTIME_APP}}</b> | Environment: <b>{{RUNTIME_INSTANCE}}</b> | Executed by <b>{{RUNTIME_USER}}</b> | Duration: <b>{{DURATION}}</b></div>
            <div class="header-layout">
                <div class="donut"><div class="donut-inner"><h1>{{SUCCESS_RATE}}%</h1><span>SUCCESS</span></div></div>
                <div class="kpis">
                    <div class="kpi"><div class="kpi-value" style="color:var(--blue)">{{TOTAL_TESTS}}</div><div>Total Tests</div></div>
                    <div class="kpi"><div class="kpi-value" style="color:var(--success)">{{PASSED_COUNT}}</div><div>Passed</div></div>
                    <div class="kpi"><div class="kpi-value" style="color:var(--failed)">{{FAILED_COUNT}}</div><div>Failed</div></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">Automation Test Results</div>
            {{SUITE_RESULTS}}
        </div>
    </div>
</body>
</html>
