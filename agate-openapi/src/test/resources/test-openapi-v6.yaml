openapi: 3.0.3

info:
  title: AGATE Phase 0 Multi Level Ref Test
  version: 1.0.0

paths:

  /employees:

    get:
      operationId: getEmployees

      responses:

        '200':
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './common-a.yaml#/components/schemas/Employee'


  /employees/{id}:

    get:
      operationId: getEmployee

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:

        '200':
          description: Employee
          content:
            application/json:
              schema:
                $ref: './common-a.yaml#/components/schemas/Employee'

        '404':
          description: Employee not found