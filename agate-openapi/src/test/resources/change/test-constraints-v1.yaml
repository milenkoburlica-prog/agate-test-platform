openapi: 3.0.3

info:
  title: Agate Constraint Change Test API
  version: 1.0.0

paths:

  /users:

    post:

      operationId: createUser

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              properties:

                username:
                  type: string
                  minLength: 3
                  maxLength: 50

                age:
                  type: integer
                  minimum: 18
                  maximum: 100

                role:
                  type: string
                  enum:
                    - USER
                    - ADMIN

                tags:
                  type: array
                  minItems: 1
                  maxItems: 10

                  items:
                    type: string


      responses:

        '200':
          description: User created


  /users/{id}:

    get:

      operationId: getUser

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 1000


        - name: language
          in: query
          required: false

          schema:
            type: string
            minLength: 2
            maxLength: 10
            enum:
              - de
              - en
              - fr


      responses:

        '200':
          description: User found