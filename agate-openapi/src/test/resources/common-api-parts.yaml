openapi: 3.0.3

info:
  title: AGATE Common API Parts
  version: 1.0.0

paths: {}

components:

  parameters:

    CompanyId:
      name: id
      in: path
      required: true
      description: Company identifier
      schema:
        type: integer
        format: int64


  requestBodies:

    CreateCompanyRequest:
      required: true
      description: Company creation request
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:

              name:
                type: string
                minLength: 2
                maxLength: 100

              active:
                type: boolean


  responses:

    CompanyResponse:
      description: Company returned
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - name
            properties:

              id:
                type: integer
                format: int64

              name:
                type: string

              active:
                type: boolean