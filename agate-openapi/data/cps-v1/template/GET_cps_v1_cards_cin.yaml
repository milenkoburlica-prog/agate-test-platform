testCases:

  - id: "{XL[testcaseName]}"
    description: "{XL[testcaseDescription]}"
    stage: "*"
    priority: HIGH

    variables:

      apiEndpoint: "{XL[apiEndpoint]}"

    steps:

      - type: REST
        op: EXEC
        command: rest.GET_cps_v1_cards_cin
        endpoint: "{B[apiEndpoint]}"
        cin: "{XL[cin]}"
        sv-system: "{XL[sv-system]}"
        sv-txid: "{XL[sv-txid]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: "{XL[statusCode]}"
