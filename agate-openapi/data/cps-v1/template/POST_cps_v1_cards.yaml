testCases:

  - id: "{XL[testcaseName]}"
    description: "{XL[testcaseDescription]}"
    stage: "*"
    priority: HIGH

    variables:

      apiEndpoint: "{XL[apiEndpoint]}"

    steps:

      - type: REST
        op: EXEC
        command: rest.POST_cps_v1_cards
        endpoint: "{B[apiEndpoint]}"
        sv-system: "{XL[sv-system]}"
        sv-txid: "{XL[sv-txid]}"
        svnr: "{XL[svnr]}"
        PuK_SV: "{XL[PuK_SV]}"
        PuK_CA_ICC: "{XL[PuK_CA_ICC]}"
        force: "{XL[force]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: "{XL[statusCode]}"
