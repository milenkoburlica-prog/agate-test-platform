testCases:

  - id: "{XL[testcaseName]}"
    description: "{XL[testcaseDescription]}"
    stage: "*"
    priority: HIGH

    variables:

      apiEndpoint: "{XL[apiEndpoint]}"

    steps:

      - type: REST
        op: EXEC
        command: rest.PUT_pet
        endpoint: "{B[apiEndpoint]}"
        id: "{XL[id]}"
        name: "{XL[name]}"
        category:
          id: "{XL[category.id]}"
          name: "{XL[category.name]}"
        photoUrls: "{XL[photoUrls]}"
        tags:
          - id: "{XL[tags.id]}"
            name: "{XL[tags.name]}"
        status: "{XL[status]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: "{XL[statusCode]}"
