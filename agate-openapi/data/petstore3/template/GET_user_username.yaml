testCases:

  - id: "{XL[testcaseName]}"
    description: "{XL[testcaseDescription]}"
    stage: "*"
    priority: HIGH

    variables:

      apiEndpoint: "{XL[apiEndpoint]}"

    steps:

      - type: REST
        op: EXEC
        command: rest.GET_user_username
        endpoint: "{B[apiEndpoint]}"
        username: "{XL[username]}"
        response: response_1

      - type: REST
        op: ASSERT
        response: response_1
        source: STATUS
        action: EQUALS
        expected: "{XL[statusCode]}"
