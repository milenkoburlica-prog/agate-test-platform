openapi: 3.0.3

info:
  title: AGATE Common A
  version: 1.0.0

paths: {}

components:

  schemas:

    Employee:
      type: object
      required:
        - id
        - name
      properties:

        id:
          type: integer
          format: int64

        name:
          type: string

        address:
          $ref: './common-b.yaml#/components/schemas/Address'

        colleagues:
          type: array
          items:
            $ref: '#/components/schemas/Employee'