openapi: 3.0.3

info:
  title: AGATE Phase 0 Test API
  version: 1.0.0

paths:

  /users/{id}:

    get:
      operationId: getUser
      summary: Get user by ID

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

        - name: details
          in: query
          required: false
          schema:
            type: boolean

      responses:

        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '404':
          description: User not found


  /users:

    post:
      operationId: createUser
      summary: Create user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:

        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'


components:

  schemas:

    CreateUserRequest:
      type: object
      required:
        - username
        - email

      properties:

        username:
          type: string

        email:
          type: string
          format: email

        age:
          type: integer
          format: int32


    User:
      type: object
      required:
        - id
        - username

      properties:

        id:
          type: integer
          format: int64

        username:
          type: string

        email:
          type: string
          format: email