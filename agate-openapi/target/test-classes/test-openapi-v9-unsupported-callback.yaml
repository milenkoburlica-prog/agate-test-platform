openapi: 3.0.3

info:
  title: AGATE Phase 0 Unsupported Callback Test
  version: 1.0.0

paths:

  /payments:

    post:
      operationId: createPayment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - callbackUrl
              properties:
                callbackUrl:
                  type: string
                  format: uri

      responses:
        '202':
          description: Payment accepted

      callbacks:

        paymentStatus:
          '{$request.body#/callbackUrl}':

            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        status:
                          type: string

              responses:
                '200':
                  description: Callback accepted