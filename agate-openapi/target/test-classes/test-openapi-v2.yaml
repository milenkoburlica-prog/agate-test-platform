openapi: 3.0.3

info:
  title: AGATE Phase 0 Schema Test API
  version: 1.0.0

paths:

  /users:

    post:
      operationId: createUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:

  schemas:

    CreateUserRequest:
      type: object

      required:
        - username
        - role

      properties:

        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9]+$'

        role:
          type: string
          enum:
            - ADMIN
            - USER
            - GUEST

        age:
          type: integer
          format: int32
          minimum: 18
          maximum: 120

        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string

        tags:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string


    User:
      type: object

      required:
        - id
        - username

      properties:

        id:
          type: integer
          format: int64

        username:
          type: string

        roles:
          type: array
          items:
            type: string
            enum:
              - ADMIN
              - USER

        manager:
          $ref: '#/components/schemas/User'