openapi: 3.0.3

info:
  title: AGATE Change Detection Demo
  version: 1.0.0

paths:

  /users:

    post:

      operationId: createUser

      requestBody:
        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/UserCreate'

      responses:

        '201':
          description: User created


  /users/{id}:

    get:

      operationId: getUser

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer
            format: int64

        - name: details
          in: query
          required: false

          schema:
            type: boolean

      responses:

        '200':
          description: User found


components:

  schemas:

    UserCreate:

      type: object

      required:
        - username

      properties:

        username:
          type: string
          minLength: 3
          maxLength: 50

        age:
          type: integer
          minimum: 18
          maximum: 120

        role:
          type: string

          enum:
            - USER
            - ADMIN