openapi: 3.0.3

info:
  title: AGATE Phase 0 Metadata Test
  version: 1.0.0

servers:
  - url: https://api.example.com/v1
  - url: https://test.example.com/v1

tags:
  - name: companies
  - name: administration

security:
  - bearerAuth: []

paths:

  /companies:

    get:
      operationId: getCompanies
      summary: Get companies
      tags:
        - companies

      responses:
        '200':
          description: Companies returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string


  /companies/legacy:

    get:
      operationId: getLegacyCompanies
      summary: Legacy company endpoint
      deprecated: true

      tags:
        - companies
        - administration

      security:
        - oauth2:
            - companies.read

      responses:
        '200':
          description: Legacy companies returned


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/token
          scopes:
            companies.read: Read companies